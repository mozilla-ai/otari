[build-system]
# 77 is the first setuptools that accepts a PEP 639 SPDX string in `license`.
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
# The laptop-side half of otari: `otari hook`, `otari hook setup` and
# `otari import`. `otari` and `otari-cli` on PyPI belong to other Mozilla AI
# projects, so the distribution is otari-agent and the import package
# otari_agent. It is the one distribution that owns the `otari` console script:
# the gateway (../pyproject.toml) declares none and attaches its server
# commands to this CLI when both are installed (gateway.cli.register).
name = "otari-agent"
description = "otari's agent-side CLI: Agent Gates hooks and Claude Code usage import"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
# Floors match the gateway's pins for the same packages, so one lock satisfies
# both. Nothing here may reach pydantic, sqlalchemy, any-llm or uvicorn: the
# Homebrew formula builds every dependency from its sdist, and
# scripts/check_architecture.py refuses the imports.
dependencies = [
    "click>=8.1.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
]

[project.scripts]
otari = "otari_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["otari_agent*"]

[tool.setuptools.package-data]
otari_agent = ["py.typed"]

# The version comes from the repository's own Git tag, the same source
# RELEASE.md names for the gateway's, so every way of installing this
# distribution reports one: a tag checkout, a `uv tool install`, and the sdist
# the Homebrew formula builds from (setuptools-scm writes the resolved version
# into its PKG-INFO, so the build needs no Git metadata of its own).
[tool.setuptools_scm]
# The tags are on the repository, and this distribution is a workspace member.
root = ".."
# Written at build time, gitignored, and read by otari_agent/__init__.py. A
# literal in a generated module, not importlib.metadata: `otari hook` runs on
# every tool call of a coding agent, and scripts/check_architecture.py bans
# entry-point discovery under otari_agent/ besides.
version_file = "src/otari_agent/_version.py"
# A build that can see no Git metadata (the Docker image copies the tree
# without .git) gets the unstamped version rather than a hard failure; that
# image names its own version in OTARI_VERSION, which `otari --version` prefers.
fallback_version = "0.0.0"
