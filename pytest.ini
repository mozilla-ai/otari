[pytest]
timeout = 120
markers =
    dashboard_bundle: needs the built dashboard bundle, so it skips without one. Applied by requires_dashboard_bundle (tests/unit/_dashboard_bundle_support.py) and selected with `-m dashboard_bundle` by the one CI job that builds a bundle (.github/workflows/otari-dashboard-serving.yml).
# google-genai uses typing._UnionGenericAlias, which Python 3.14 deprecates.
# TODO: Remove this filter once the locked google-genai version no longer imports that name.
filterwarnings =
    ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types
