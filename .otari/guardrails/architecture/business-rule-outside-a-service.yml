schema_version: "1.0"
policy:
  id: otari/architecture/business-rule-outside-a-service
  description: Core, repositories, schemas, models and exceptions hold no business rules.

gates:

  - id: business-rule-outside-a-service
    type: judge
    runs: [stop.session]
    enforcement: advisory
    when_changed:
      - "src/gateway/core/**"
      - "src/gateway/exceptions/**"
      - "src/gateway/models/**"
      - "src/gateway/repositories/**"
      - "src/gateway/schemas/**"
    rubric: >-
      Judge only code this diff adds under src/gateway/core/, repositories/, schemas/,
      models/ or exceptions/. Fail if it adds a business rule there. A business rule decides
      what the product allows or does. A query filter that a use case asks for, the
      mapping of a row to a schema, the closed vocabulary of a column, and the HTTP
      status of an error class are not business rules. This is the "Must not" column in
      docs/domains.md, "The target shape". Pass if the diff adds no business rule in
      these layers.
