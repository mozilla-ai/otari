schema_version: "1.0"
policy:
  id: otari/architecture
  description: A script checks the modular monolith's layer rules.

gates:

  - id: architecture-layer-rules-check
    type: verifier
    runs: [stop.verifier]
    enforcement: required
    when_changed: ["cli/src/otari_agent/**", "scripts/check_architecture.py", "src/**", "tests/**"]
    verifier: .otari/verifiers/check-architecture.sh
    message: >-
      The layer and import rules check failed. Fix each reported violation
      (ARCHITECTURE.md, "The modular monolith"), and never add a module to a
      baseline to pass it.
