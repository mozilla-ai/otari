schema_version: "1.0"
policy:
  id: otari/architecture/service-imported-below-its-package-root
  description: Code outside a service package that is not a domain yet imports only its root.

gates:

  - id: service-imported-below-its-package-root
    type: judge
    runs: [stop.session]
    enforcement: advisory
    when_changed:
      - "src/gateway/*.py"
      - "src/gateway/adapters/**"
      - "src/gateway/api/**"
      - "src/gateway/services/**"
    rubric: >-
      Judge only the import lines this diff adds under src/gateway/. Fail if one of them
      imports a module below the root of a service package whose name is not a domain
      docs/domains.md gives a section, from outside that package. For example,
      gateway.services.tenancy.user_service imported by a module outside
      services/tenancy/ fails. This is layer and import rule 5 in ARCHITECTURE.md, "The
      modular monolith". The architecture check covers the packages named for a domain.
      Pass if the diff adds no such import.
