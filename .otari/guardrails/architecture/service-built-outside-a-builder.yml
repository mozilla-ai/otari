schema_version: "1.0"
policy:
  id: otari/architecture/service-built-outside-a-builder
  description: A service receives its dependencies from a builder and never receives a session.

gates:

  - id: service-built-outside-a-builder
    type: judge
    runs: [stop.session]
    enforcement: advisory
    when_changed:
      - "src/gateway/*.py"
      - "src/gateway/adapters/**"
      - "src/gateway/api/**"
      - "src/gateway/services/**"
    rubric: >-
      Judge only code this diff adds under src/gateway/. Fail if it gives a service's
      constructor a database session or another domain's repository, or if it constructs
      a service anywhere except a builder function in src/gateway/api/deps.py. This is
      "Constructor injection" and "Builders" in docs/domains.md, "The target shape".
      Pass if the diff constructs no service and changes no service constructor.
