schema_version: "1.0"
policy:
  id: otari/architecture/domain-service-import-cycle
  description: Domain service packages never import each other in a cycle.

gates:

  - id: domain-service-import-cycle
    type: judge
    runs: [stop.session]
    enforcement: advisory
    when_changed:
      - "src/gateway/services/**"
    rubric: >-
      Judge only the import lines this diff adds under src/gateway/services/. Fail if
      one of them makes two domain service packages import each other, directly or
      through a third package. An interface that one domain defines and another
      implements is not a cycle. This is layer and import rule 6 in ARCHITECTURE.md,
      "The modular monolith". Pass if the diff adds no such import.
