schema_version: "1.0"
policy:
  id: otari/secrets
  description: Keeping a secret's contents out of the session transcript.

gates:

# Two halves of one rule, which is why they share a file: the Read tool is
# refused before the contents reach the transcript, and the shell spelling of
# the same read is refused by phrase. Prevention or nothing, in both cases: a
# read changes nothing, so no stop source can catch one that got through.

  - id: no-secret-reads
    type: path
    runs: [pre_tool_use.read_target]
    enforcement: required
    # Both spellings of each, because `**` must consume a path segment: the
    # `**/` form alone never reaches the root-level file. `otari guardrails
    # validate` names each missing twin. Scoped to .env deliberately: this
    # repo tracks no keys or certificates, and a glob matching nothing that
    # exists is the dead pattern that same command warns about.
    forbidden: [".env", "**/.env", ".env.*", "**/.env.*"]
    message: >-
      Secrets stay out of the transcript: once a whole file is read into it,
      it is there for the rest of the session. If you need one value, grep
      for that one line instead of reading the file.

  - id: no-shell-secret-reads
    type: command
    runs: [pre_tool_use.command]
    enforcement: required
    # The half no-secret-reads cannot see. Leaky by construction, in two
    # shapes, both measured: a phrase matches a *contiguous* token run, so a
    # flag between the tool and the path breaks it (`head -5 .env` gets
    # through while `head .env` does not), and the path is compared
    # literally outside the head position, so a qualified spelling breaks it
    # too (`cat config/.env`). Kept anyway: it catches the bare forms and
    # the message teaches the rest. Deliberately no bare `.env` phrase,
    # which would catch everything here and also refuse
    # `grep -n SECRET .env`, the mitigation this very message recommends.
    forbidden: ["cat .env", "less .env", "head .env", "tail .env", "cat .env.local"]
    message: >-
      Reading a secret file through the shell puts it in the transcript just
      as a Read does, and nothing catches it afterwards. Grep for the one
      value you need.
