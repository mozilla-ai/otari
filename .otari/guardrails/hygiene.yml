schema_version: "1.0"
policy:
  id: otari/hygiene
  description: Working-tree checks a repo-local verifier script decides.

gates:

  - id: no-leftover-conflict-markers
    type: verifier
    runs: [stop.verifier]
    enforcement: required
    verifier: .otari/verifiers/no-conflict-markers.sh
    message: >-
      A tracked file still carries a Git merge-conflict marker
      (<<<<<<</=======/>>>>>>>). Resolve the conflict and remove the
      markers before finishing.

  - id: no-stranded-docblocks
    type: verifier
    runs: [stop.verifier]
    enforcement: required
    verifier: .otari/verifiers/no-stranded-docblocks.py
    when_changed: ["web/src/**"]
    message: >-
      A docblock in web/src sits directly above a declaration it does not
      document. See AGENTS.md, "Repository Conventions": a docblock belongs
      immediately above the declaration it describes, and the way it stops
      doing so is an insertion beside it.
