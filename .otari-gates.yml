schema_version: "1.0"
policy:
  id: otari/repo-quality
  description: Rules this repo checks on its own working tree.

gates:
  - id: no-hand-edited-changelog
    type: changed_path
    enforcement: required
    forbidden: ["CHANGELOG.md"]
    message: >-
      CHANGELOG.md is generated by git-cliff at release time (see AGENTS.md,
      "Generated Artifacts"). Do not hand-edit it in a PR.

  - id: use-pnpm-not-npm
    type: command_match
    enforcement: required
    # Narrowed to real invocations rather than the bare tool name: a phrase
    # matches a token in any position, so "npm" alone also refused ordinary
    # commands that merely mention it, `grep -rn npm web/` among them.
    forbidden: ["npm install", "npm ci", "npm run", "npm i", "npm exec"]
    message: >-
      web/ is pnpm, not npm (see web/AGENTS.md, "Use pnpm as pinned in
      package.json"). Use pnpm --dir web ... instead.

  - id: openapi-changed-needs-postman
    type: command_if_changed
    enforcement: required
    when_changed: ["docs/public/openapi.json"]
    require: ["make postman"]
    message: >-
      docs/public/openapi.json changed; regenerate it with
      scripts/generate_openapi.py, then run `make postman` to keep the
      Postman collection in sync (see AGENTS.md, "Generated Artifacts").

  # Not a changed_path gate: `make postman` is what writes this file, so
  # forbidding any change to it would deadlock against the gate above, which
  # requires running exactly that. What is actually forbidden is changing it
  # by hand, and "the generator ran" is the only evidence that separates the
  # two.
  - id: postman-collection-changed-needs-make
    type: command_if_changed
    enforcement: required
    when_changed: ["docs/public/otari.postman_collection.json"]
    require: ["make postman"]
    message: >-
      Generated by scripts/generate_postman.py from openapi.json (see
      AGENTS.md, "Generated Artifacts"). Run `make postman` instead of
      hand-editing it.

  - id: no-static-pwa-manifest
    type: changed_path
    enforcement: required
    forbidden: ["web/public/pwa/manifest*"]
    message: >-
      The PWA manifest is generated at build time by web/pwaManifest.ts;
      only icons live under web/public/pwa/ (see web/AGENTS.md, "PWA
      manifest").

  - id: no-force-push
    type: command_match
    enforcement: advisory
    forbidden: ["git push --force", "git push -f"]
    message: >-
      Force-pushing rewrites shared history; use --force-with-lease if you
      must. (main is already protected server-side; this covers other
      branches.)

  - id: cli-changed-needs-tests
    type: command_if_changed
    enforcement: required
    when_changed: ["src/gateway/cli.py"]
    require: ["tests/unit/test_gateway_cli.py"]
    message: >-
      You touched the CLI; run tests/unit/test_gateway_cli.py before
      finishing (see AGENTS.md, "Change Validation Checklist").
