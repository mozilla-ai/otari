<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{{SUBJECT}}</title>
    <!-- What inline styles cannot hold: the brand fonts, which only clients that
         fetch web fonts use (everything else reads in Arial and Menlo), and the
         narrow-screen rules. -->
    <style>
      {{FONT_FACES}}
      @media only screen and (max-width: 600px) {
        .o-band { padding-left: 20px !important; padding-right: 20px !important; }
        .o-buttons { width: 100% !important; }
        .o-button { display: block !important; text-align: center !important; }
        .o-button a { display: block !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#f7f8f8;">
{{PREHEADER}}
    <!-- The dashboard's sign-in card in mail: the mark above a square card with
         two teal corner marks, hairline-divided bands inside, the sign-in footer
         below. Colors are the dashboard's light tokens flattened to hex. -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f8f8;">
      <tr>
        <td align="center" style="padding:40px 12px 48px 12px;">
          <!-- width="100%" with the pixel cap in CSS, not width="560": some
               mobile clients honor the HTML attribute over max-width and render
               a 560px card inside a 390px viewport, which scrolls sideways. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
            <tr>
              <td style="padding:0 0 16px 0;">{{MARK}}<span style="font-family:'Mozilla Text',Arial,Helvetica,sans-serif; font-size:16px; line-height:24px; font-weight:600; color:#08090a; vertical-align:middle;">Otari</span></td>
            </tr>
            <tr>
              <td style="background-color:#ffffff; border:1px solid #e6e7e7;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td>
                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td width="8" height="8" style="width:8px; height:8px; font-size:0; line-height:0; border-top:2px solid #0098a4; border-left:2px solid #0098a4;">&nbsp;</td>
                          <td style="font-size:0; line-height:0;">&nbsp;</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
{{BODY}}
                  <tr>
                    <td>
                      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td style="font-size:0; line-height:0;">&nbsp;</td>
                          <td width="8" height="8" style="width:8px; height:8px; font-size:0; line-height:0; border-bottom:2px solid #0098a4; border-right:2px solid #0098a4;">&nbsp;</td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 0 0 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="font-family:'Mozilla Text',Arial,Helvetica,sans-serif; font-size:13px; line-height:19px; color:#5a5f6b;">One gateway. Every model.</td>
                    <td align="right" style="font-family:'Fira Code',Menlo,Consolas,'Courier New',monospace; font-size:13px; line-height:19px; color:#5a5f6b;">Mozilla AI</td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
