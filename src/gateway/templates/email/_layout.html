<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

  <body style="margin:0; padding:0; background-color:#f4f5f6; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f6; padding:32px 0;">
      <tr>
        <td align="center">
          <!-- width="100%" with the pixel cap in CSS, not width="480": some
               mobile clients honor the HTML attribute over max-width and render
               a 480px card inside a 360px viewport, which scrolls sideways. -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; padding:32px; max-width:480px;">
            <tr>
              <td>
                <p style="margin:0 0 24px 0; font-size:20px; font-weight:600; color:#0f172a;">Otari</p>
{{BODY}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
