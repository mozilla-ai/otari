# Gateway config for recording the README dashboard GIF. SQLite so there is no
# external dependency; a fixed master key so the login step is deterministic.
# See scripts/demo_gif/record.sh for the full pipeline.
database_url: "sqlite:///./scripts/demo_gif/demo.db"
host: "127.0.0.1"
port: 8000
master_key: "otari-demo-key"
# Show pricing/usage without gating requests behind the pricing requirement.
require_pricing: false
# Fail model discovery fast: the providers below without the mock upstream have
# no live one, so the gateway falls back to each instance's declared `models:`
# list and reports them healthy for the demo.
model_discovery_timeout_seconds: 2

# Demo providers. Each declares the models it serves, so the dashboard lists them
# and reports the provider healthy. The OpenAI-compatible ones (openai and
# deepseek) point at mock_provider.py on :8099, which streams canned replies so the
# Playground has something to show; the rest point at a closed local port and
# rely on the declared-models fallback. Keys are placeholders.
providers:
  openai:
    provider_type: openai
    api_key: sk-demo-openai-placeholder
    api_base: "http://127.0.0.1:8099/v1"
    models:
      - gpt-6.1-sol
      - gpt-6-luna
      - gpt-6-astra
  anthropic:
    provider_type: anthropic
    api_key: sk-demo-anthropic-placeholder
    api_base: "http://127.0.0.1:9"
    models:
      - claude-opus-5-5
      - claude-sonnet-5-5
  google:
    provider_type: gemini
    api_key: demo-gemini-placeholder
    api_base: "http://127.0.0.1:9"
    models:
      - gemini-3.8-flash
      - gemini-3.5-flash-lite
  groq:
    provider_type: groq
    api_key: gsk-demo-groq-placeholder
    api_base: "http://127.0.0.1:9/v1"
    models:
      - openai/gpt-oss-120b
      - qwen/qwen3.8-27b
  mistral:
    provider_type: mistral
    api_key: demo-mistral-placeholder
    api_base: "http://127.0.0.1:9/v1"
    models:
      - mistral-medium-latest
      - devstral-2512
  deepseek:
    provider_type: deepseek
    api_key: sk-demo-deepseek-placeholder
    api_base: "http://127.0.0.1:8099/v1"
    models:
      - deepseek-v4-pro
      - deepseek-v4-flash
  xai:
    provider_type: xai
    api_key: xai-demo-placeholder
    api_base: "http://127.0.0.1:9"
    models:
      - grok-4.7

# Routing policies, so the Routing page and the Activity routing column have
# something to show. seed.py attributes part of the usage to these names.
routing:
  policies:
    smart:
      select:
        - router: weighted
          candidates:
            - openai:gpt-6.1-sol
            - anthropic:claude-sonnet-5-5
          weights:
            openai:gpt-6.1-sol: 60
            anthropic:claude-sonnet-5-5: 40
        - default: openai:gpt-6.1-sol
      on_failure:
        - google:gemini-3.8-flash
    thrifty:
      select:
        - when:
            budget_used_pct: {gte: 80}
          target: deepseek:deepseek-v4-flash
        - default: openai:gpt-6-luna
      on_failure:
        - groq:openai/gpt-oss-120b
    coding:
      select:
        - default: anthropic:claude-opus-5-5
      on_failure:
        - openai:gpt-6.1-sol
        - mistral:devstral-2512
    fast:
      select:
        - default: groq:openai/gpt-oss-120b
      on_failure:
        - google:gemini-3.5-flash-lite
