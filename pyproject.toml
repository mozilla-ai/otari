[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Distribution + import package stay `gateway`: the `otari` name on PyPI is the
# Otari client SDK (a transitive dep via any-llm-sdk), so a top-level `otari`
# package here would collide with it. User-facing names (CLI, env vars, docs)
# are `otari`; only the internal import path remains `gateway`.
name = "gateway"
version = "0.0.0"
description = "otari, an OpenAI-compatible LLM gateway"
requires-python = ">=3.13"
dependencies = [
    "any-llm-sdk[all]>=1.25.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",
    # OAuth protocol mechanics for dashboard sign-in: provider endpoints, the
    # code exchange, and the userinfo fetch that normalizes a provider response
    # into an identity profile. The platform moved onto it in otari-ai#1740 and
    # this edition follows, so the two do not keep separate copies of a protocol
    # neither of us owns. What stays ours is which providers are configured,
    # which scopes are asked for, and how a fetched identity maps onto a user.
    "apron-auth>=0.15.1,<0.16.0",
    "asyncpg>=0.29.0",
    # Password hashing for the dashboard sign-in (docs/access-control.md).
    # The library directly rather than passlib, which the platform wraps it in:
    # passlib has been unmaintained since 2020 and its bcrypt backend breaks on
    # bcrypt 4.1+. The stored hash is the same "$2b$" string on either side, so an
    # identity imported from otari.ai signs in here and one created here signs in
    # there. 5.0 is the floor because that is the release that refuses a password
    # over 72 bytes instead of truncating it, which is the behavior
    # `gateway.services.password_service` documents and relies on.
    "bcrypt>=5.0.0",
    "click>=8.1.0",
    "cryptography>=50.0.0",
    "fastapi>=0.115.0",
    "genai-prices>=0.1.0",
    # Pinned retrieval imports transport internals, so constrain both libraries
    # to the tested minor versions instead of relying on transitive dependencies.
    "httpcore>=1.0.9,<1.1.0",
    "httpx>=0.28.1,<0.29.0",
    # URL policy and pinned retrieval use one explicit UTS #46/STD3 identity.
    # Keep this direct rather than relying on HTTPX's transitive dependency.
    "idna>=3.10",
    "markitdown[docx,pptx,xlsx,pdf]>=0.1.0",
    "mcp>=1.28.1,<2.0.0",
    "opentelemetry-api>=1.39.1",
    "pillow>=12.3.0",
    "pypdfium2>=4.30.0",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.31",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.24",
    "trafilatura>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    "opentelemetry-proto>=1.39.1",
    "webauthn>=2.5.0",
]

[project.optional-dependencies]
# Optional OCR backend for image/scanned-PDF text extraction. Heavy (onnxruntime),
# so it's opt-in; the gateway degrades to vision-describe / drop when absent.
ocr = [
    "rapidocr-onnxruntime>=1.3.0",
    "numpy>=1.26.0",
]
# S3-compatible (AWS S3 or MinIO/any S3-compatible endpoint) files backend.
# boto3 is already present transitively via any-llm-sdk[all] (Bedrock), but
# this extra is what build_file_store checks for and documents, so the S3
# backend stays decoupled from that implementation detail.
s3 = [
    "boto3>=1.42.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]",
    # Validating payloads against the published code-execution contract
    # (docs/public/code-execution-openapi.yaml), in its conformance script and
    # the test that keeps the spec and the doc in agreement. Nothing at runtime
    # uses it: the gateway parses that contract with its own Pydantic models.
    "jsonschema>=4.26.0",
    "types-jsonschema",
    "moto[s3]>=5.0.0",
    "mypy",
    # Parses the mcp dependency spec straight out of this file's own
    # [project.dependencies], in the regression test for #689, instead of
    # relying on packaging being pulled in transitively.
    "packaging>=24.0",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.2.1,<8",
    "pytest-rerunfailures>=16.0",
    "pytest-timeout",
    "pytest-xdist>=3.6.1",
    "ruff>=0.15.9",
    "testcontainers[postgres]>=4.0.0",
]

[project.scripts]
otari = "gateway.cli:main"

[tool.uv]
# Otari is deployed as a Linux server and developed on Linux / macOS; it is
# never packaged for Windows. Pinning the resolution environments keeps the
# universal lock from inheriting magika's win32-only `onnxruntime<=1.20.1`
# cap, which otherwise forces an onnxruntime build with no cp314 wheels and
# breaks the Python 3.14 Docker image. With win32 excluded, onnxruntime
# resolves to a release that ships cp314 wheels for linux and macOS.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
# authlib is imported nowhere here: apron-auth owns the OAuth mechanics and
# pulls it in. It stays floored rather than listed as a direct dependency,
# which would claim an import that does not exist. The floor is above
# apron-auth's own >=1.6.12 because authlib has a dense advisory history,
# including a signature-verification bypass fixed in 1.6.9. Matches the floor
# the platform sets for the same dependency (otari-ai backend/pyproject.toml).
#
# **This binds uv, not every installer.** It governs `uv lock` and `uv sync`, so
# it covers `uv.lock`, CI, and the Docker image, which is every way Otari is
# actually built here. It does *not* reach a plain `pip install gateway`, where
# apron-auth's own `>=1.6.12` is the only floor. That is accepted rather than
# overlooked: promoting authlib to a direct dependency would claim an import
# this tree does not have, and the advisory is in a transitive dependency whose
# own maintainer sets the real floor. Revisit if Otari is ever published as a
# wheel people pip-install directly.
constraint-dependencies = ["authlib>=1.7.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gateway*"]

[tool.setuptools.package-data]
# The static/dashboard/* bundle is built, not committed (see .gitignore), so run
# `make dashboard` before building a wheel. A pattern that matches nothing is
# skipped silently, so a wheel built without it installs cleanly and the gateway
# degrades to the tutorial page (gateway/dashboard.py). Patterns stay glob-only:
# Vite decides the filenames, while pwa/ holds the manifest and icons that
# index.html links and fonts/ the brand faces that globals.css asks for, each
# with the SIL OFL text the license requires to travel with it (main.py mounts
# them at /pwa and /fonts). A subdirectory needs its own line: these patterns do
# not recurse, so a bundle directory missing here ships as a 404 at runtime.
gateway = [
    "templates/*.html",
    "templates/*.svg",
    "templates/email/*.html",
    "templates/email/*.txt",
    "static/dashboard/*",
    "static/dashboard/assets/*",
    "static/dashboard/pwa/*",
    "static/dashboard/fonts/*",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests", "scripts"]
# `demo/` is shell scripts; nothing for ruff to do there.
extend-exclude = ["demo/"]

[tool.ruff.lint]
select = ["E", "F", "I", "PERF"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_openapi.py" = ["E402"]
"tests/integration/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
# Standalone web-search adapters are independent services (own Dockerfile +
# requirements), not part of the gateway package. They each ship a top-level
# `app.py`, so type-checking them together trips mypy's duplicate-module guard.
# Their behavior is covered by tests/unit/test_*_adapter.py.
exclude = ["scripts/web-search-[^/]+-adapter/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["trafilatura.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional/untyped extraction deps imported at the root (e.g. `import pypdfium2`,
# `from markitdown import ...`). Bare root names are required — a `foo.*` pattern
# alone does not match the top-level `foo` module these are imported as.
module = ["markitdown", "pypdfium2", "rapidocr_onnxruntime", "numpy", "PIL"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The OTLP proto messages and google.protobuf runtime helpers ship without stubs.
module = ["google.protobuf.*", "opentelemetry.proto.*"]
ignore_missing_imports = true
