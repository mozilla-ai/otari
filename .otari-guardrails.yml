schema_version: "1.0"
policy:
  id: otari/repo-quality
  description: Rules this repo checks on its own working tree.

gates:

# ---------------------------------------------------------------------------
# Path gates: refuse an edit tool before it writes, and catch anything
# else (a shell redirect, a build, a script) in the working tree afterwards.
# ---------------------------------------------------------------------------

  - id: no-hand-edited-changelog
    type: path
    runs: [pre_tool_use.edit_target, stop.working_tree]
    enforcement: required
    forbidden: ["CHANGELOG.md"]
    message: >-
      CHANGELOG.md is generated by git-cliff at release time (see AGENTS.md,
      "Generated Artifacts"). Do not hand-edit it in a PR.

  # Both spellings are needed: the matcher requires `**` to consume at least
  # one path segment, so `**/CLAUDE.md` alone catches web/ and src/gateway/
  # but never the root file.
  - id: no-hand-edited-claude-md
    type: path
    runs: [pre_tool_use.edit_target, stop.working_tree]
    enforcement: required
    forbidden: ["CLAUDE.md", "**/CLAUDE.md"]
    message: >-
      CLAUDE.md is a one-line `@AGENTS.md` import, kept as a file rather than
      a symlink so Windows clones survive. Edit the AGENTS.md beside it
      instead (see AGENTS.md, top).

  - id: no-static-pwa-manifest
    type: path
    runs: [pre_tool_use.edit_target, stop.working_tree]
    enforcement: required
    forbidden: ["web/public/pwa/manifest*"]
    message: >-
      The PWA manifest is generated at build time by web/pwaManifest.ts;
      only icons live under web/public/pwa/ (see web/AGENTS.md, "PWA
      manifest").

  - id: no-committed-dashboard-bundle
    type: path
    runs: [pre_tool_use.edit_target, stop.working_tree]
    enforcement: required
    forbidden:
    - src/gateway/static/dashboard/**
    message: 'AGENTS.md Generated Artifacts: the dashboard bundle (src/gateway/static/dashboard/)
      is generated and not committed; do not commit changes under this path.'

# ---------------------------------------------------------------------------
# Read gate: refuse the Read tool before a secret's contents reach the
# transcript, where they would stay for the rest of the session. Prevention
# or nothing: a read changes nothing, so no stop source can catch one that
# got through. `cat .env` is the shell's way around this and is covered by
# no-shell-secret-reads below, imperfectly.
# ---------------------------------------------------------------------------

  - id: no-secret-reads
    type: path
    runs: [pre_tool_use.read_target]
    enforcement: required
    # Both spellings of each, because `**` must consume a path segment: the
    # `**/` form alone never reaches the root-level file. `otari guardrails
    # validate` names each missing twin. Scoped to .env deliberately: this
    # repo tracks no keys or certificates, and a glob matching nothing that
    # exists is the dead pattern that same command warns about.
    forbidden: [".env", "**/.env", ".env.*", "**/.env.*"]
    message: >-
      Secrets stay out of the transcript: once a whole file is read into it,
      it is there for the rest of the session. If you need one value, grep
      for that one line instead of reading the file.

# ---------------------------------------------------------------------------
# Command gates: refuse the command itself, before it runs. The only
# gates here that can stop a shell write, and the only ones that see a
# shell read.
# ---------------------------------------------------------------------------

  - id: no-shell-secret-reads
    type: command
    runs: [pre_tool_use.command]
    enforcement: required
    # The half no-secret-reads cannot see. Leaky by construction, in two
    # shapes, both measured: a phrase matches a *contiguous* token run, so a
    # flag between the tool and the path breaks it (`head -5 .env` gets
    # through while `head .env` does not), and the path is compared
    # literally outside the head position, so a qualified spelling breaks it
    # too (`cat config/.env`). Kept anyway: it catches the bare forms and
    # the message teaches the rest. Deliberately no bare `.env` phrase,
    # which would catch everything here and also refuse
    # `grep -n SECRET .env`, the mitigation this very message recommends.
    forbidden: ["cat .env", "less .env", "head .env", "tail .env", "cat .env.local"]
    message: >-
      Reading a secret file through the shell puts it in the transcript just
      as a Read does, and nothing catches it afterwards. Grep for the one
      value you need.

  - id: use-pnpm-not-npm
    type: command
    runs: [pre_tool_use.command]
    enforcement: required
    # Narrowed to real invocations rather than the bare tool name: a phrase
    # matches a token in any position, so "npm" alone also refused ordinary
    # commands that merely mention it, `grep -rn npm web/` among them.
    forbidden: ["npm install", "npm ci", "npm run", "npm i", "npm exec"]
    message: >-
      web/ is pnpm, not npm (see web/AGENTS.md, "Use pnpm as pinned in
      package.json"). Use pnpm --dir web ... instead.

  - id: no-force-push
    type: command
    runs: [pre_tool_use.command]
    enforcement: advisory
    forbidden: ["git push --force", "git push -f"]
    message: >-
      Force-pushing rewrites shared history; use --force-with-lease if you
      must. (main is already protected server-side; this covers other
      branches.)

# ---------------------------------------------------------------------------
# Correlation gates: "if this changed, that must have run". Need the
# finished session, so they only ever resolve at Stop.
# ---------------------------------------------------------------------------

  - id: openapi-changed-needs-postman
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["docs/public/openapi.json"]
    require: ["make postman"]
    message: >-
      docs/public/openapi.json changed; regenerate it with
      scripts/generate_openapi.py, then run `make postman` to keep the
      Postman collection in sync (see AGENTS.md, "Generated Artifacts").

  # Stacks with the gate above rather than extending its `require`: any one
  # phrase in a `require` list satisfies that gate, so adding the generator
  # there would let `make postman` alone pass. AGENTS.md asks for both
  # commands, so each is its own required gate.
  - id: openapi-changed-needs-generator
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["docs/public/openapi.json"]
    require: ["scripts/generate_openapi.py"]
    message: >-
      docs/public/openapi.json is generated. Run
      `uv run python scripts/generate_openapi.py` rather than editing the
      spec by hand (see AGENTS.md, "Generated Artifacts").

  # Not a path gate: `make postman` is what writes this file, so
  # forbidding any change to it would deadlock against the gate above, which
  # requires running exactly that. What is actually forbidden is changing it
  # by hand, and "the generator ran" is the only evidence that separates the
  # two.
  - id: postman-collection-changed-needs-make
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["docs/public/otari.postman_collection.json"]
    require: ["make postman"]
    message: >-
      Generated by scripts/generate_postman.py from openapi.json (see
      AGENTS.md, "Generated Artifacts"). Run `make postman` instead of
      hand-editing it.

  - id: cli-changed-needs-tests
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["src/gateway/cli.py"]
    require: ["tests/unit/test_gateway_cli.py"]
    message: >-
      You touched the CLI; run tests/unit/test_gateway_cli.py before
      finishing (see AGENTS.md, "Change Validation Checklist").

  - id: agent-cli-changed-needs-tests
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["cli/src/otari_agent/**"]
    require: ["tests/unit/test_otari_agent_cli.py"]
    message: >-
      You touched the otari-agent CLI; run tests/unit/test_otari_agent_cli.py
      and the hook tests before finishing (see AGENTS.md, "Change Validation
      Checklist").

  # Not a path gate, for the same reason as the Postman one above:
  # `uv add` is what writes this file, so forbidding any change to it would
  # refuse the very command the rule asks for. `uv lock` is on the list
  # because pyproject.toml also carries ruff, mypy and packaging config: a
  # session that edited one of those has no dependency to add, and `uv lock`
  # is the cheap proof that uv.lock still matches whatever it did change.
  - id: pyproject-changed-needs-uv
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["pyproject.toml"]
    require: ["uv add", "uv remove", "uv lock"]
    message: >-
      pyproject.toml changed without uv. Add or drop a dependency with
      `uv add` / `uv remove` (also `--group dev`, `--optional <extra>`)
      rather than editing the list by hand, so uv.lock moves with it. If
      you changed something else in the file, run `uv lock` to confirm the
      lockfile is still in sync.

  - id: dashboard-client-changed-needs-codegen
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["web/src/client/schema.ts"]
    require: ["client:generate"]
    message: >-
      web/src/client/schema.ts is generated from docs/public/openapi.json and
      committed, with a CI drift check over it. Run
      `pnpm --dir web run client:generate` rather than editing it by hand
      (see web/AGENTS.md, "Data and generated files").

  - id: routes-changed-needs-sdk-manifest
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["src/gateway/api/routes/**", "docs/public/openapi.json"]
    require: ["tests/unit/test_sdk_endpoint_coverage.py", "make test-unit"]
    message: >-
      A new/changed route owes an entry in scripts/sdk_codegen/sdk-endpoints.txt
      under [covered] or [excluded]; run tests/unit/test_sdk_endpoint_coverage.py
      and fix any drift (see AGENTS.md, "Generated Artifacts").

  - id: frontend-standards-changed-needs-coverage
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed:
      [
        ".github/skills/frontend-standards/**",
        ".github/instructions/frontend-standards.instructions.md",
        "scripts/rule_coverage/frontend-standards.txt",
      ]
    require: ["tests/unit/test_frontend_rule_coverage.py", "make test-unit"]
    message: >-
      A heading added to the frontend-standards skill or its instructions
      counterpart owes a manifest line in scripts/rule_coverage/frontend-standards.txt;
      run tests/unit/test_frontend_rule_coverage.py (see AGENTS.md, "Skills &
      Scoped Instructions").

  - id: code-execution-spec-changed-needs-contract-check
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["docs/public/code-execution-openapi.yaml", "docs/code-execution-protocol.md"]
    require: ["tests/unit/test_code_execution_contract.py", "make test-unit"]
    message: >-
      docs/public/code-execution-openapi.yaml (hand-maintained) and
      docs/code-execution-protocol.md must stay in sync; run
      tests/unit/test_code_execution_contract.py (see AGENTS.md, "Generated
      Artifacts").

  - id: architecture-layer-rules-check
    type: command_if_changed
    runs: [stop.session]
    enforcement: required
    when_changed: ["src/gateway/**", "cli/src/otari_agent/**"]
    require: ["make check-architecture", "make lint"]
    message: >-
      You touched src/gateway/ or cli/src/otari_agent/; run `make check-architecture` (or `make lint`,
      which includes it) and fix any reported import/layering violation
      before finishing (see AGENTS.md, "Lint / Typecheck").

# ---------------------------------------------------------------------------
# Verifier gates: a repo-local script's exit code decides. Stop only.
# ---------------------------------------------------------------------------

  - id: no-leftover-conflict-markers
    type: verifier
    runs: [stop.verifier]
    enforcement: required
    verifier: .otari-guardrails/verifiers/no-conflict-markers.sh
    message: >-
      A tracked file still carries a Git merge-conflict marker
      (<<<<<<</=======/>>>>>>>). Resolve the conflict and remove the
      markers before finishing.

  - id: no-stranded-docblocks
    type: verifier
    runs: [stop.verifier]
    enforcement: required
    verifier: .otari-guardrails/verifiers/no-stranded-docblocks.py
    when_changed: ["web/src/**"]
    message: >-
      A docblock in web/src sits directly above a declaration it does not
      document. See AGENTS.md, "Repository Conventions": a docblock belongs
      immediately above the declaration it describes, and the way it stops
      doing so is an insertion beside it.

# ---------------------------------------------------------------------------
# Judge gates: a model verdict against a rubric. Advisory by construction,
# and one real model call each, so they are scoped with when_changed.
# ---------------------------------------------------------------------------

  # judge and verifier gates only ever evaluate on a Stop event: otari hook has no finished diff or session for
  # either a model or a verifier to check against on a PreToolUse call. See
  # docs/agent-guardrails.md, "judge"/"verifier" and "Trying it against a
  # real Claude Code session".
  - id: no-narrative-comments
    type: judge
    runs: [stop.session]
    enforcement: advisory
    # A judge gate costs one real model call per applicable Stop event, so
    # this is scoped to source, not every path in the repo: a session that
    # only touches docs, config, or generated files pays nothing.
    when_changed: ["src/gateway/**", "cli/src/otari_agent/**", "web/src/**"]
    rubric: >-
      Check whether this diff adds or rewrites a comment or docstring that
      restates what the code already says, narrates the change being made
      (e.g. "added X", "now does Y", "changed from Z"), or records what the
      code used to do or why it differs from a prior version. The rule
      (AGENTS.md, "Repository Conventions"): add a comment only where the
      logic is not obvious; keep a docstring concise and meaningful;
      narration, repeated rationale, and implementation history belong in
      the commit message, not left in the code. Fail only on a comment or
      docstring this diff adds or rewrites that violates this. Do not fail
      on a comment that explains a genuinely non-obvious invariant,
      constraint, or workaround (exactly what this rule still wants kept),
      and do not fail when this diff adds or changes no comments at all.
    message: >-
      This diff may add a comment that restates the code, narrates the
      change, or records prior behavior instead of explaining a non-obvious
      WHY (see AGENTS.md, "Repository Conventions"): that belongs in the
      commit message, not left in the code.

  # Merged from two separately generated gates (no-em-dash-prose,
  # use-us-english-spelling): both are the same AGENTS.md "Writing style"
  # section, and each applicable judge gate still costs its own model call
  # even though otari hook runs them concurrently (_hook_collect_judge_verdicts
  # in cli.py). One rubric checking both is one call instead of two for a
  # session touching the same files.
  - id: writing-style-violations
    type: judge
    runs: [stop.session]
    enforcement: advisory
    # Both Markdown spellings, for the reason no-hand-edited-claude-md above
    # gives: `**` consumes at least one path segment, so `**/*.md` alone
    # reaches docs/ and web/ but never README.md at the root.
    when_changed: ["*.md", "**/*.md", "src/gateway/**", "cli/src/otari_agent/**", "web/src/**"]
    rubric: >-
      Flag two things in prose (README, docs, doc comments, docstrings,
      commit messages, PR descriptions, user-visible UI copy), per AGENTS.md
      "Writing style": (1) an em dash (—) or a double hyphen (--) used as a
      sentence separator, where a comma, semicolon, colon, parenthesis,
      period, or rephrasing should be used instead; do not flag code, a CLI
      flag like --all, or an en-dash numeric range like 3–4. (2) A
      British/non-US spelling (e.g. 'behaviour', 'recognise', 'serialise',
      'catalogue', 'labelled', 'licence', 'colour'); do not flag an
      identifier/attribute borrowed from an external API (e.g.
      aria-labelledby, asyncio.CancelledError, GitHub's 'cancelled' job
      conclusion), a value that travels on the wire or into a database, or a
      third-party product's own name.
    message: 'AGENTS.md Writing style: avoid em dashes/double hyphens as prose separators,
      and spell prose in US English (identifiers, wire values, and third-party names
      borrowed from elsewhere keep their original spelling).'

  - id: no-leaked-secrets-in-logs-or-errors
    type: judge
    runs: [stop.session]
    enforcement: advisory
    when_changed: ["src/gateway/**", "cli/src/otari_agent/**"]
    rubric: Flag any log statement, error message, or public-facing error response that
      includes a secret, token, or raw API key, or that otherwise leaks internal details
      (stack traces, internal file paths, header contents) to a client. The one-time bootstrap
      key print is a deliberate, allowed exception; nothing else should log or return
      a raw credential.
    message: 'Possible secret/token/API-key leak in logs or an internal detail exposed
      in a public error response (AGENTS.md § Repository Conventions: ''Preserve security-relevant
      behavior ... never log secrets, tokens, or raw API keys'').'

