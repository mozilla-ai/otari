# Gateway config used only by the Playwright E2E suite (web/playwright.config.ts
# boots a gateway with this, serving the built dashboard bundle). SQLite so there
# is no external dependency; a fixed master key so the login step is deterministic.
database_url: "sqlite:///./web/e2e/e2e.db"
host: "127.0.0.1"
port: 8000
master_key: "e2e-master-key"
# Keep the smoke focused on the flows under test rather than the pricing gate.
require_pricing: false
# Lets a member give their own key a federation rule, which the workload
# identity spec does through the dashboard.
federation_member_rules: true
# The docs project (e2e/docs) captures the Tools pages, whose controls are all
# disabled on a deployment with no search backend, fetcher or sandbox. `.invalid`
# never resolves, so nothing is ever reached; no spec runs a tool.
web_search_url: "http://search.invalid"
web_fetch_enabled: true
sandbox_url: "http://sandbox.invalid"
