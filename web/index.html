<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Otari admin dashboard: browse and price models, manage aliases, and toggle runtime settings." />
    <!-- Installing the dashboard to a phone home screen: the manifest supplies
         the Android icon, name, and standalone display; iOS ignores it and reads
         the apple-touch-icon plus the apple-mobile-web-app-* meta tags instead. -->
    <link rel="manifest" href="/pwa/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <!-- Browser/OS chrome tint. A meta tag cannot read a custom property, so this
         is a literal copy of --color-primary; the matching `theme_color` in
         pwaManifest.ts (which generates /pwa/manifest.webmanifest) is the other
         one. Change all three together. -->
    <meta name="theme-color" content="#0098a4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Otari" />
    <!-- "default" keeps the content below the status bar; "black-translucent"
         would run the app shell underneath it, and the shell has no safe-area
         insets to sit out of the way. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Otari</title>
    <!-- Moves a link from before path routing (`/#/keys`, `/#/verify-email?token=…`)
         to the path it names, before the router reads the address. The server
         never sees a fragment, so only the page can do this, and it runs here
         rather than in the bundle because the router reads the address as its
         module loads. `replaceState` rather than a navigation: the old link's
         token goes from one fragment to another without a request carrying it.
         A link's secret stays in the fragment, as `/verify-email#token=…`, where
         the gateway now puts it; anything else's query joins the page's own. An
         OAuth callback's route was renamed with the move and is renamed here.
         `src/app/legacyHashRoute.test.ts` runs this script. -->
    <script id="legacy-hash-route">
      (function () {
        var hash = window.location.hash
        if (hash.indexOf("#/") !== 0) return
        var route = hash.slice(2)
        var queryAt = route.indexOf("?")
        var path = queryAt === -1 ? route : route.slice(0, queryAt)
        var query = queryAt === -1 ? "" : route.slice(queryAt + 1)
        var secret = /^(setup|verify-email|reset-password|accept-invitation)$/.test(path)
        path = path.replace(/^auth\/([^/]+)\/callback$/, "sign-in/$1/callback")
        var search = window.location.search.slice(1)
        if (query && !secret) search = search ? search + "&" + query : query
        window.history.replaceState(
          null,
          "",
          "%BASE_URL%" +
            path +
            (search ? "?" + search : "") +
            (query && secret ? "#" + query : ""),
        )
      })()
    </script>
    <!-- Applies the remembered theme before the first paint. `useTheme` sets the
         same three properties, but it can only do so once React has mounted,
         which is after the boot screen below has already been painted light: a
         dark-mode operator saw a white flash on every load. Keep this in sync
         with the effect in src/shared/hooks/useTheme.tsx; the storage key and
         the resolution are the same on both sides: a stored "light" or "dark"
         wins, and anything else follows the operating system. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("otari.dashboard.theme")
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          var root = document.documentElement
          root.setAttribute("data-theme", resolved)
          root.classList.toggle("dark", resolved === "dark")
          root.style.colorScheme = resolved
        } catch (error) {
          // Storage refused, or no matchMedia. The stylesheet's own defaults
          // apply and the effect corrects it a moment later, which is the
          // behavior this script exists to improve on, not to replace.
        }
      })()
    </script>
    <!-- Paints the boot state below. A <style> block rather than a Tailwind
         class (which the frontend standards otherwise rule out) because this has
         to render before the bundle's stylesheet is a certainty: it is the thing
         that covers loading the bundle. The colors read the design tokens where
         globals.css has already loaded and fall back to its values where it has
         not, so this stays one hex behind --color-background rather than a second
         source of truth for it. -->
    <style>
      .app-boot {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--color-background, #f7f8f8);
      }
      .app-boot-spinner {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 9999px;
        border: 2px solid var(--color-border, rgb(0 0 0 / 0.06));
        border-top-color: var(--color-primary, #0098a4);
        animation: app-boot-spin 0.7s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown until React mounts. `main.tsx` reads GET /v1/bootstrap before it
         renders anything, so without this the page is blank for that round trip,
         and for the whole 8s deadline when a gateway accepts the connection and
         then stalls. `createRoot().render()` clears the container on its first
         render, so nothing here has to be torn down. -->
    <div id="root">
      <div class="app-boot" role="status" aria-label="Loading the dashboard">
        <div class="app-boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
