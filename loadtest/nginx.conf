# One load balancer in front of the two replicas.
events {
    worker_connections 4096;
}

http {
    access_log off;

    upstream otari {
        least_conn;
        server otari-1:8000 max_fails=1 fail_timeout=5s;
        server otari-2:8000 max_fails=1 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 80;
        client_max_body_size 20m;

        location / {
            proxy_pass http://otari;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Streams must reach the client as they are produced.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            # A POST is not retried on another replica once sent (nginx's default
            # for non-idempotent methods), so a killed replica's in-flight
            # requests fail as they would behind a real load balancer. A refused
            # connection, before anything was sent, does move on.
            proxy_next_upstream error timeout;
        }
    }
}
