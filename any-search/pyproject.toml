[build-system]
requires = ["setuptools>=84.2.0", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

[project]
# Web search providers behind one interface, built the way any-llm is: import
# it, give it a key, call it. otari is its first consumer, not its owner, so it
# may not import the gateway or its server stack (scripts/check_architecture.py
# refuses it), and it does not import its sibling, any-fetch.
name = "any-search"
description = "One interface to web search providers"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
# Providers are called over HTTP directly, with no vendor SDKs. The floors are
# the gateway's: its httpx pin, and the pydantic its pydantic-settings needs.
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
any-search = "any_search.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["any_search*"]

[tool.setuptools.package-data]
any_search = ["py.typed"]

# The version comes from the repository's Git tag, as cli/'s does, until the
# package is published on its own.
[tool.setuptools_scm]
root = ".."
# The Docker image copies the tree without .git.
fallback_version = "0.0.0"

[tool.setuptools_scm.scm.git]
# Otari's own `vX.Y.Z` tags only: the packages under integrations/ tag their
# releases `<package>-vX.Y.Z` in this repository, and describing one of those
# would version this distribution as that package.
describe_command = "git describe --dirty --tags --long --match v[0-9]*"
