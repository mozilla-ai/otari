# git-cliff configuration for Otari.
#
# Generates CHANGELOG.md and the GitHub Release body from conventional-commit
# messages on `main`. Driven by `git cliff` in
# .github/workflows/{otari-release,otari-tag-release}.yml; run `make changelog`
# for a local preview.
#
# Visibility policy lives in RELEASE.md under "Changelog visibility".

[changelog]
header = """
# Changelog

All notable changes to Otari will be documented in this file.

The format follows [Conventional Commits](https://www.conventionalcommits.org/).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/mozilla-ai/otari/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }}\
{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/mozilla-ai/otari/pull/{{ commit.remote.pr_number }}){% endif %}\
{% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){% endif %} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/mozilla-ai/otari/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
{%- if github.contributors | filter(attribute="is_first_time", value=true) | length > 0 %}

### New Contributors

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
{% if contributor.pr_number -%}
- [@{{ contributor.username }}](https://github.com/{{ contributor.username }}) made their first contribution in [#{{ contributor.pr_number }}](https://github.com/mozilla-ai/otari/pull/{{ contributor.pr_number }})
{% endif -%}
{% endfor %}
{%- endif %}
{% if previous and previous.version and version -%}

**Full Changelog**: https://github.com/mozilla-ai/otari/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true
footer = ""

[remote.github]
owner = "mozilla-ai"
repo = "otari"

[git]
conventional_commits = true
# Don't drop commits that fail conventional-commit parsing. We surface them
# under the "Other" group via the catch-all parser below, and the release
# workflow additionally fails when git-cliff still emits a parse-error
# warning. That combo guarantees no commit is ever silently lost.
filter_unconventional = false
filter_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
protect_breaking_commits = true

commit_preprocessors = [
  # Strip the trailing " (#1234)" that GitHub appends to squash-merge
  # subjects. git-cliff's GitHub remote integration resolves the same PR
  # number and renders it as a link, so leaving the literal in the message
  # ends up duplicating the reference on every line.
  #
  # (?m) so $ matches end-of-line (the subject is followed by the body).
  # The pattern is intentionally narrow: a literal space + (#NNN) + end of
  # line. Looser variants like \s+...\s*$ confuse git-cliff's conventional-
  # commit parser and flip commit.conventional to false, which silently
  # drops the scope from the rendered line.
  { pattern = '(?m) \(#\d+\)$', replace = "" },

  # Mark a commit breaking after it reached main without the `!`. Each entry
  # matches one exact subject and rewrites it to carry the marker and the
  # setting that keeps the old behavior. Keep the entries: every release
  # regenerates the whole CHANGELOG.md, so removing one drops its marker.
  { pattern = '(?m)^feat\(tools\): run provider-native code execution on the sandbox when the model has none$', replace = "feat(tools)!: run provider-native code execution on the sandbox when the model has none. With sandbox_url set, a code_interpreter or code_execution declaration that the model's provider does not run natively now runs on the sandbox and is billed as a sandbox tool call; code_execution_executor: provider keeps forwarding it" },
  { pattern = "(?m)^feat\\(files\\): serve both SDKs' Files APIs, with the schema and services behind them$", replace = "feat(files)!: serve both SDKs' Files APIs, with the schema and services behind them. GET /api/v1/files now returns at most 100 files per page (limit up to 1000) with has_more, where it returned every file; and a background sweep deletes the rows and bytes of soft-deleted and expired files every hour, and files_sweep_interval_sec: 0 leaves cleanup to the operator as before" },
]

commit_parsers = [
  # Historical merge commits (merge-commit merges are disabled now, but the
  # pre-squash history still contains them). Drop rather than route to Other.
  { message = "^Merge ", skip = true },

  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^security", group = "Security" },
  { message = "^revert", group = "Reverts" },

  { message = "^chore: bump version", skip = true },
  { message = "^chore: release", skip = true },

  # protect_breaking_commits overrides skip, so a breaking commit of a hidden
  # type still renders, under this group. A parser on the `breaking` field would
  # drop non-conventional commits instead, because they lack that field.
  { message = "^chore\\(deps\\)", skip = true, group = "Maintenance" },
  { message = "^chore", skip = true, group = "Maintenance" },
  { message = "^build", skip = true, group = "Maintenance" },
  { message = "^ci", skip = true, group = "Maintenance" },
  { message = "^docs", skip = true, group = "Maintenance" },
  { message = "^style", skip = true, group = "Maintenance" },
  { message = "^refactor", skip = true, group = "Maintenance" },
  { message = "^test", skip = true, group = "Maintenance" },

  # Catch-all: any commit that didn't match a typed prefix above (e.g. a
  # squash-merge that landed without a conventional-commit type) lands in
  # "Other" instead of being silently dropped from the changelog. The
  # release workflow also fails when git-cliff emits a parse-error warning,
  # so this is the second of two safety nets.
  { message = ".*", group = "Other" },
]
