# GitBook Git Sync configuration for the gitbook-docs branch.
#
# scripts/prepare_gitbook_site.py copies this file to the root of the built
# site, so `root` is that root and not this repository's docs/ directory.
#
# `readme` stays index.md rather than the conventional README.md: the file is
# linked from the project README and from code comments, and renaming it would
# break those references for no gain here.

root: ./

structure:
  readme: index.md
  summary: SUMMARY.md

# The menu groups pages by kind (Getting started, How-to guides, Integrations,
# Reference, Learn), and GitBook builds a page's URL from its group, so these
# keep the URLs of the earlier reader-based groups working. otari-ai's
# frontend links several of them (docsRedirectMap.ts).
redirects:
  start-here/quickstart: quickstart.md
  start-here/modes: modes.md
  for-operators/deployment: deployment.md
