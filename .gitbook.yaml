# GitBook Git Sync configuration for the gitbook-docs branch.
#
# scripts/prepare_gitbook_site.py copies this file to the root of the built
# site, so `root` is that root and not this repository's docs/ directory.
#
# `readme` stays index.md rather than the conventional README.md: the file is
# linked from the project README and from code comments, and renaming it would
# break those references for no gain here.

root: ./

structure:
  readme: index.md
  summary: SUMMARY.md

# Old addresses of pages that moved, so links and bookmarks keep working. Keys are
# paths on the site; values are pages in this tree. The builder appends one entry per
# generated API endpoint page (prepare_gitbook_site.py, ENDPOINT_REDIRECTS).
redirects:
  # The otari.ai user guide's pages, merged into this site.
  getting-started/quickstart: get-started/quickstart.md
  learn/workspaces: guides/organizations-and-workspaces.md
  learn/provider-keys: guides/provider-keys.md
  learn/budgets: guides/budgets.md
  learn/billing: otari-ai/billing.md
  how-to-guides/manage-workspaces: guides/organizations-and-workspaces.md
  how-to-guides/invite-and-manage-organization-members: guides/members.md
  how-to-guides/manage-provider-keys: guides/provider-keys.md
  how-to-guides/rotate-a-provider-key: guides/provider-keys.md
  how-to-guides/set-a-budget-and-ceiling: guides/budgets.md
  how-to-guides/create-a-multi-provider-routing: guides/routing.md
  how-to-guides/manage-guardrails: guides/guardrails.md
  tools/configure-web-search: guides/tools.md
  tools/configure-code-execution: guides/tools.md
  tools/add-an-mcp-server: guides/mcp.md
  playground/playground: guides/playground.md

  # The pages this site served under /otari/, by their old path in either form.
