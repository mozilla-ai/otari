version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Without this, pinned SHAs go
  # stale and miss upstream security patches; Dependabot bumps both the SHA and
  # the trailing version comment as new releases ship.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week for routine minor/patch bumps to cut review noise;
      # major bumps still arrive as individual PRs so they get scrutiny.
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # The Dockerfile's base images are pinned by digest, which goes stale the same
  # way a pinned action SHA does; Dependabot moves the digest when the tag does.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies resolved through uv. The ecosystem must be "uv", not
  # "pip": the pip ecosystem does not understand uv.lock, so it would leave the
  # lockfile (the thing CI and the Docker image actually install from, both via
  # --frozen) untouched while editing pyproject.toml.
  #
  # This block adds *version* updates. Security updates are a separate feature
  # that needs no config and already runs here, which is why advisory-driven
  # bumps arrived for years while a stale-but-unvulnerable package like
  # a floored dependency sat six releases behind.
  #
  # A direct dependency moves by raising its floor. An indirect one with no
  # advisory stays where it is locked until someone runs `uv lock --upgrade`
  # (CONTRIBUTING.md).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # No entry for the dashboard: Dependabot documents pnpm support only through
  # v10 and web/ requires a newer pnpm, so one would target a lockfile format it
  # cannot resolve. Its security alerts do not reach web/ either, because the
  # dependency graph no longer reads that lockfile. otari-dashboard-audit.yml
  # covers advisories in the meantime; version updates are tracked in #1001.
