name: Otari Railway Listing

# Publishes deploy/railway/listing.md as the live Railway template's README
# whenever it changes on main, then reads the README back to confirm it took
# (scripts/check_railway_template.py --publish-readme). The README is the one
# part of the template Railway's public API writes, through templatePublish;
# the script reads the listing's description, category and icon back first and
# sends them unchanged, since the mutation replaces them all.
#
# Only the README is checked here. The image tag and variables, which only the
# template editor can change, are otari-railway-template.yml's to report.
#
# RAILWAY_API_TOKEN is a Railway account or workspace token with access to the
# mozilla-ai workspace that owns the template. Without it the run skips the
# publish with a warning, and listing.md is pasted into the editor by hand.
# Standard library only, so no environment is installed.

on:
  push:
    branches: [ main ]
    paths:
      - 'deploy/railway/listing.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otari-railway-listing
  cancel-in-progress: false

jobs:
  publish:
    name: Publish listing.md to the live template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
    # main as it is now, whichever ref started the run: a dispatch from a
    # branch cannot publish an unmerged listing, and a run that starts late
    # cannot publish an older one over a newer one.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        persist-credentials: false

    - name: Publish the README to the live template
      if: env.RAILWAY_API_TOKEN != ''
      run: python3 scripts/check_railway_template.py --publish-readme

    - name: Report the missing token
      if: env.RAILWAY_API_TOKEN == ''
      run: echo "::warning::RAILWAY_API_TOKEN is not set, so listing.md was not published. Paste it into the template editor's README field by hand."
