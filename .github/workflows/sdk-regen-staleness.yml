name: SDK Regen PR Staleness

# Alerts when an SDK regeneration PR (opened by otari-sdk-codegen.yml on the
# sdk-codegen/client-core branch) needs attention, which signals an SDK lagging
# the Otari spec. A PR is flagged when its checks are failing (at any age) or it
# has been open past the freshness window. Keeps a single tracking issue on this
# repo in sync: opened/updated while any PR is flagged, closed once none are.
#
# Reading PRs on the SDK repos needs a token with pull-requests:read on
# mozilla-ai/otari-sdk-{python,ts,go,rust}; the SDK_CODEGEN_TOKEN used by the
# codegen workflow already has it. The default GITHUB_TOKEN manages the tracking
# issue on this repo.

on:
  schedule:
    # Mondays at 13:00 UTC. Deliberately weekly, not daily, even though the
    # failing-checks trigger below would detect a break sooner if polled more
    # often. The script reuses only a currently-open tracking issue, so a
    # condition that flaps red/green opens a fresh issue each cycle, and CI is
    # flaky enough (a GitHub Actions outage alone can redden every job) that
    # daily polling would turn transient failures into recurring alerts. Weekly
    # trades detection latency for an alert that stays worth reading.
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Days a regeneration PR may stay open before it is flagged'
        required: false
        default: '7'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Otari
        # The script authenticates via the gh CLI using the env tokens below, so
        # the checkout's persisted git credential is unused; drop it to avoid
        # leaving GITHUB_TOKEN in .git/config while repository code runs.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: 3.14

      - name: Check for stale regeneration PRs
        env:
          # SDK repos live outside this repo, so the cross-repo read token is
          # required; the tracking issue on this repo uses GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.SDK_CODEGEN_TOKEN }}
          OTARI_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '7' }}
        # The script is stdlib-only and shells out to the preinstalled gh CLI, so
        # the project environment does not need syncing.
        run: |
          uv run --no-project python scripts/check_stale_regen_prs.py \
            --max-age-days "${MAX_AGE_DAYS}" \
            --tracking-repo "${GITHUB_REPOSITORY}" \
            --apply
