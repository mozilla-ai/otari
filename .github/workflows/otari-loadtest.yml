name: Otari Load Test

# Compares a PR's merge commit with its base under load, route by route, with
# loadtest/run.sh (see loadtest/README.md). The checks fail on a regression;
# adding the `perf-accepted` label re-runs the job and lets a deliberate cost
# pass (the label is read when the job runs, so a manual re-run sees it too).

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
    paths:
      - 'src/**'
      - 'cli/src/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'pyproject.toml'
      - 'cli/pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - 'loadtest/**'
      - '.github/workflows/otari-loadtest.yml'

permissions:
  contents: read

jobs:
  compare:
    if: github.event.action != 'labeled' || github.event.label.name == 'perf-accepted'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: loadtest-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # A PR's checkout is its merge commit, and its first parent is the base it
      # was merged onto, so the difference is the PR alone. The event's base.sha
      # is not that commit once main has moved, as on a later `labeled` run.
      - name: Resolve base
        id: base
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Read the cache otari-docker.yml writes on main and write none back, as
      # otari-docker-build.yml does: a fork PR cannot.
      - name: Build head image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: otari:head
          cache-from: type=gha

      - name: Build base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: base
          load: true
          tags: otari:base
          cache-from: type=gha

      - name: Read the perf-accepted label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name' | grep -qx perf-accepted; then
            echo "LOADTEST_ACCEPT_REGRESSION=1" >> "$GITHUB_ENV"
          fi

      - name: Compare base and head
        env:
          BASE_REF: ${{ steps.base.outputs.sha }}
          HEAD_REF: ${{ github.sha }}
        run: ./loadtest/run.sh otari:base otari:head

      - name: Job summary
        if: always()
        run: |
          for report in loadtest/results/ab-*/report.md; do
            if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loadtest
          path: loadtest/results/
          if-no-files-found: ignore
