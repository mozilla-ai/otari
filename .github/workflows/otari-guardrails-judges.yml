name: Otari Guardrails Judges

# Runs the repository's judge gates (.otari/) against every pull request and
# posts their advisory findings on it. See docs/agent-guardrails.md,
# "Checking a pull request in CI".
#
# pull_request_target runs this file as it is on the base branch, so a pull
# request cannot edit the job that holds the model credential. That is safe
# only because nothing here runs the pull request: the working tree is the
# base commit, the pull request is fetched as Git objects alone, and every
# value it controls reaches the shell through `env`.
on:
  pull_request_target:
    branches: [ main ]

permissions: {}

concurrency:
  group: otari-guardrails-judges-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  judges-skipped:
    name: Judge gates
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Skip the judge gates on a fork
        run: echo "::notice title=Judge gates skipped::A pull request from a fork is not given the model credential."

  judges:
    name: Judge gates
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Holds CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY. This workflow runs on
    # the base branch, so the environment can restrict its deployment branches
    # to main.
    environment: agent-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The findings comment.
      pull-requests: write
    steps:
      - name: Check for a model credential
        id: credential
        env:
          AVAILABLE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          if [ "$AVAILABLE" != true ]; then
            echo "::notice title=Judge gates skipped::The agent-guardrails environment holds no CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY."
          fi

      - name: Check out the base commit
        if: steps.credential.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A head that can no longer be fetched was force-pushed away, and the run
      # for the new head checks the pull request instead.
      - name: Fetch the pull request head
        id: fetch
        if: steps.credential.outputs.available == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR/head"
          if git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Judge gates skipped::The pull request head $HEAD_SHA is gone, so a newer run checks the pull request."
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.fetch.outputs.fetched == 'true'
        with:
          python-version: 3.14
          enable-cache: false

      # NOTE: The Claude Code version is pinned, but npm does not check the
      # download against an integrity hash, because no lockfile covers it.
      - name: Install the CLI and Claude Code
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          uv sync --frozen --no-dev --package otari-agent
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.292

      # A base commit from before the command existed, such as an old pull
      # request's, cannot judge anything. Only the usage error for an unknown
      # command (exit 2) means that; any other failure is a broken install.
      - name: Check that the base commit can run the gates
        id: cli
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          if .venv/bin/otari guardrails check --help > /dev/null 2> "$RUNNER_TEMP/probe.txt"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$?" -eq 2 ]; then
            echo "::notice title=Judge gates skipped::The base commit's CLI has no \`otari guardrails check\`."
          else
            cat "$RUNNER_TEMP/probe.txt"
            exit 1
          fi

      # The judge runs `claude -p` with every tool and MCP server disabled,
      # because the diff it reads is the pull request author's text. Only the
      # credential that is set is exported, so an empty one never shadows it.
      #
      # The report carries model text shaped by that diff. Printed raw, a line
      # such as `::add-mask::` would run as a workflow command, so the log
      # prints it with workflow commands stopped. The summary and the comment
      # read a copy whose runs of three backticks are broken up, so the text
      # stays inside its fence.
      - name: Run the judge gates
        id: judges
        if: steps.cli.outputs.ready == 'true'
        shell: bash
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$OAUTH_TOKEN" ]; then
            export CLAUDE_CODE_OAUTH_TOKEN="$OAUTH_TOKEN"
          else
            export ANTHROPIC_API_KEY="$API_KEY"
          fi
          unset OAUTH_TOKEN API_KEY
          report="$RUNNER_TEMP/judges.txt"
          status=0
          .venv/bin/otari guardrails check --base "$BASE_SHA" --head "$HEAD_SHA" --type judge \
            > "$report" || status=$?
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          cat "$report"
          echo "::$token::"
          sed "s/\`\`\`/'''/g" "$report" > "$RUNNER_TEMP/judges-fenced.txt"
          {
            echo '### Judge gates'
            echo '```text'
            cat "$RUNNER_TEMP/judges-fenced.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # One comment per pull request, edited on every push. It is created only
      # once a judge gate fails, and a later run updates it either way, so a
      # fixed finding does not stay posted. A judge that could not run is in
      # the job summary, and does not start a comment.
      # It names the commit it describes, because a run that fails or is
      # canceled leaves the previous one in place.
      - name: Post the findings on the pull request
        if: steps.judges.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- otari-guardrails-judges -->'
          body="$RUNNER_TEMP/judges-comment.md"
          {
            echo "$marker"
            echo '**Agent guardrails: judge gates**'
            echo
            echo "A model read the diff up to $HEAD_SHA against each judge gate. Its findings are advisory and do not block the merge."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/judges-fenced.txt"
            echo '```'
            echo
            echo "[View the run]($RUN_URL)"
          } > "$body"
          existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          existing=${existing%%$'\n'*}
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" > /dev/null
          elif grep -qE '^  fail ' "$RUNNER_TEMP/judges.txt"; then
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F "body=@$body" > /dev/null
          fi

      # The CLI's exit status ignores judge findings, so the job fails here to
      # show them in the checks list. It is not a required check, so a finding
      # still does not block the merge.
      - name: Fail on a judge finding
        if: steps.judges.outcome == 'success'
        run: |
          if grep -qE '^  fail ' "$RUNNER_TEMP/judges.txt"; then
            echo "::error title=Judge gates::A judge gate did not pass. Its finding is advisory; see the job summary."
            exit 1
          fi
