name: Otari Libs Live

# The live tests of any-search and any-fetch against the real providers, keyed
# from repository secrets. The libraries call providers over plain HTTP with no
# vendor SDK, so nothing absorbs a change on a provider's side: an adapter
# checks every field it reads and raises `unexpected_response` on a change, and
# this run is how that change is noticed without anyone following each
# provider's changelog. The tests check the data too (each test_live.py's
# EXPECTED table), not only that a call succeeds.
#
# Weekly, so a change is noticed in a quiet week; GitHub notifies the person who
# last changed the schedule of a failed scheduled run. Also on a pull request
# that changes either library: a run costs a
# few cents and the providers' answers are stable enough to block a merge on.
# A pull request from a fork gets no secrets, so its live tests skip, as they do
# anywhere without a key, and a notice says so. A scheduled or manual run without
# a key fails instead, so the weekly check cannot stop working unnoticed.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'any-search/**'
      - 'any-fetch/**'
      - '.github/workflows/otari-libs-live.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

# One live run per ref at a time: two concurrent runs double the spend for no extra signal.
concurrency:
  group: otari-libs-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libs-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `secrets` cannot be read in a job-level `if`, so the presence check is a
      # step, and the key is exposed to the steps that need it only.
      HAS_EXA_KEY: ${{ secrets.EXA_API_KEY != '' }}
      HAS_MOJEEK_KEY: ${{ secrets.MOJEEK_API_KEY != '' }}
      HAS_SERPLY_KEY: ${{ secrets.SERPLY_API_KEY != '' }}
      HAS_TABSTACK_KEY: ${{ secrets.TABSTACK_API_KEY != '' }}
      HAS_DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}

    steps:
    - name: Say so when the Exa key is absent
      if: env.HAS_EXA_KEY != 'true' && github.event_name == 'pull_request'
      run: echo "::notice::The EXA_API_KEY secret is not available to this run; the Exa live tests skip."

    - name: Fail a scheduled or manual run without the Exa key
      if: env.HAS_EXA_KEY != 'true' && github.event_name != 'pull_request'
      run: |
        echo "::error::The EXA_API_KEY secret is not set, so the Exa live tests cannot run."
        exit 1

    - name: Say so when the Mojeek key is absent
      if: env.HAS_MOJEEK_KEY != 'true' && github.event_name == 'pull_request'
      run: echo "::notice::The MOJEEK_API_KEY secret is not available to this run; the Mojeek live tests skip."

    - name: Fail a scheduled or manual run without the Mojeek key
      if: env.HAS_MOJEEK_KEY != 'true' && github.event_name != 'pull_request'
      run: |
        echo "::error::The MOJEEK_API_KEY secret is not set, so the Mojeek live tests cannot run."
        exit 1

    - name: Say so when the Serply key is absent
      if: env.HAS_SERPLY_KEY != 'true' && github.event_name == 'pull_request'
      run: echo "::notice::The SERPLY_API_KEY secret is not available to this run; the Serply live tests skip."

    - name: Fail a scheduled or manual run without the Serply key
      if: env.HAS_SERPLY_KEY != 'true' && github.event_name != 'pull_request'
      run: |
        echo "::error::The SERPLY_API_KEY secret is not set, so the Serply live tests cannot run."
        exit 1

    - name: Say so when the Tabstack key is absent
      if: env.HAS_TABSTACK_KEY != 'true' && github.event_name == 'pull_request'
      run: echo "::notice::The TABSTACK_API_KEY secret is not available to this run; the Tabstack live tests skip."

    - name: Fail a scheduled or manual run without the Tabstack key
      if: env.HAS_TABSTACK_KEY != 'true' && github.event_name != 'pull_request'
      run: |
        echo "::error::The TABSTACK_API_KEY secret is not set, so the Tabstack live tests cannot run."
        exit 1

    - name: Say so when the DeepSeek key is absent
      if: env.HAS_DEEPSEEK_KEY != 'true' && github.event_name == 'pull_request'
      run: echo "::notice::The DEEPSEEK_API_KEY secret is not available to this run; the DeepSeek live tests skip."

    - name: Fail a scheduled or manual run without the DeepSeek key
      if: env.HAS_DEEPSEEK_KEY != 'true' && github.event_name != 'pull_request'
      run: |
        echo "::error::The DEEPSEEK_API_KEY secret is not set, so the DeepSeek live tests cannot run."
        exit 1

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: 3.14
        activate-environment: true

    - name: Install dependencies
      run: uv sync --dev --frozen

    # One run per library, since both have test files of the same names (Makefile, test-libs).
    - name: Live searches
      env:
        ANY_SEARCH_LIVE: "1"
        EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        MOJEEK_API_KEY: ${{ secrets.MOJEEK_API_KEY }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        SERPLY_API_KEY: ${{ secrets.SERPLY_API_KEY }}
      run: uv run pytest -v -rs any-search/tests/test_live.py

    - name: Live fetches
      env:
        ANY_FETCH_LIVE: "1"
        EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        TABSTACK_API_KEY: ${{ secrets.TABSTACK_API_KEY }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: uv run pytest -v -rs any-fetch/tests/test_live.py
