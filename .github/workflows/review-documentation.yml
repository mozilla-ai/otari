name: "Documentation Review"
on:
  schedule:
    - cron: "0 3 * * 3,5"
  workflow_dispatch:

permissions: {}

jobs:
  review:
    uses: ./.github/workflows/automation-review.yml
    permissions:
      contents: read
      id-token: write
    with:
      task: documentation
      prompt: .github/prompts/documentation-maintenance.prompt.md
