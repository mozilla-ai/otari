name: Otari Dashboard

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web/**'
      # The dashboard bundles this guide (web/src/pages/DocsPage.tsx), so a change
      # to it changes the built app; build and test it.
      - 'docs/dashboard.md'
      # The gateway side of serving the bundle, plus its tests. They skip
      # themselves when no bundle is present, so otari-tests.yml never runs them
      # and this workflow is the only place they execute. Scoped to all of
      # src/gateway rather than to the modules that serve the bundle today: the
      # cache headers, auth exemptions and mounts these tests pin all live in
      # main.py now, and naming files here would silently drop the coverage the
      # day a refactor moves them. Before the bundle stopped being committed
      # these tests ran in every otari-tests.yml run, so this keeps that reach.
      - 'src/gateway/**'
      - 'tests/unit/test_gateway_root_page.py'
      - 'tests/unit/test_dashboard_build.py'
      - '.github/workflows/otari-dashboard.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      # The dashboard bundles this guide (web/src/pages/DocsPage.tsx), so a change
      # to it changes the built app; build and test it.
      - 'docs/dashboard.md'
      # The gateway side of serving the bundle, plus its tests. They skip
      # themselves when no bundle is present, so otari-tests.yml never runs them
      # and this workflow is the only place they execute. Scoped to all of
      # src/gateway rather than to the modules that serve the bundle today: the
      # cache headers, auth exemptions and mounts these tests pin all live in
      # main.py now, and naming files here would silently drop the coverage the
      # day a refactor moves them. Before the bundle stopped being committed
      # these tests ran in every otari-tests.yml run, so this keeps that reach.
      - 'src/gateway/**'
      - 'tests/unit/test_gateway_root_page.py'
      - 'tests/unit/test_dashboard_build.py'
      - '.github/workflows/otari-dashboard.yml'
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check
      run: npm run typecheck

    - name: Test
      run: npm test

    # The bundle is not committed (the Docker image builds it in a web stage), so
    # there is nothing to compare against; this proves the build still succeeds.
    - name: Build
      run: npm run build

  e2e:
    # Browser end-to-end smoke: boot the gateway serving the freshly built bundle
    # (Playwright's webServer, see web/playwright.config.ts) and walk the core
    # multi-page flows a real operator does.
    #
    # Scoped to the workflow's paths, which cover web/** plus all of src/gateway,
    # so a backend change that breaks a dashboard-served flow is caught here even
    # when it lands nowhere near the modules that mount the bundle.
    #
    # This job also owns the dashboard-serving unit tests. They skip themselves
    # when no bundle is present (it is built, not committed), so the main test
    # suite in otari-tests.yml no longer exercises them; here a bundle exists.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.14"

    - name: Install Python deps
      run: uv sync --dev --frozen

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install web deps
      working-directory: web
      run: npm ci

    - name: Install Playwright Chromium
      working-directory: web
      run: npx playwright install --with-deps chromium

    # Built here rather than via `npm run e2e` (which builds then runs Playwright)
    # so the pytest step below and Playwright share one build instead of two.
    - name: Build dashboard
      working-directory: web
      run: npm run build

    # These are skipped by the main suite, which has no bundle. They cover what
    # Playwright cannot see from the browser: the /pwa mount, cache headers, and
    # the /dashboard-build.json id.
    - name: Test the gateway serves the built bundle
      run: uv run pytest -v tests/unit/test_gateway_root_page.py tests/unit/test_dashboard_build.py

    - name: Run end-to-end tests
      working-directory: web
      run: npx playwright test
