name: Otari Dashboard

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web/**'
      # The dashboard bundles this guide (web/src/pages/DocsPage.tsx), so a change
      # to it changes the built app; build and test it.
      - 'docs/dashboard.md'
      # Frontend paths only. The gateway side of serving the bundle is covered by
      # otari-dashboard-serving.yml, which is triggered by src/gateway/** and runs
      # the pytest half; these two jobs (vitest, and Playwright against a built
      # bundle) test web/ and would only add runtime to a backend PR.
      - '.github/workflows/otari-dashboard.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      # The dashboard bundles this guide (web/src/pages/DocsPage.tsx), so a change
      # to it changes the built app; build and test it.
      - 'docs/dashboard.md'
      # Frontend paths only. The gateway side of serving the bundle is covered by
      # otari-dashboard-serving.yml, which is triggered by src/gateway/** and runs
      # the pytest half; these two jobs (vitest, and Playwright against a built
      # bundle) test web/ and would only add runtime to a backend PR.
      - '.github/workflows/otari-dashboard.yml'
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type-check
      run: npm run typecheck

    - name: Test
      run: npm test

    # The bundle is not committed (the Docker image builds it in a web stage), so
    # there is nothing to compare against; this proves the build still succeeds.
    - name: Build
      run: npm run build

  e2e:
    # Browser end-to-end smoke: boot the gateway serving the freshly built bundle
    # (Playwright's webServer, see web/playwright.config.ts) and walk the core
    # multi-page flows a real operator does.
    #
    # Scoped to this workflow's web/** paths. A change elsewhere in src/gateway that
    # breaks a dashboard-served flow is not caught here; the pytest half of that
    # coverage lives in otari-dashboard-serving.yml, which src/gateway/** triggers.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.14"

    - name: Install Python deps
      run: uv sync --dev --frozen

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install web deps
      working-directory: web
      run: npm ci

    - name: Install Playwright Chromium
      working-directory: web
      run: npx playwright install --with-deps chromium

    # `npm run e2e` builds the bundle first (see web/package.json), so a local run
    # and CI serve the same freshly built dashboard.
    - name: Run end-to-end tests
      working-directory: web
      run: npm run e2e
