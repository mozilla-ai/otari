name: Otari Dashboard

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web/**'
      # The dashboard bundles this guide (web/src/features/docs/DocsPage.tsx), so a change
      # to it changes the built app; build and test it.
      - 'docs/dashboard.md'
      # The committed API client is generated from the spec, so a spec change is a
      # client change even when no file under web/ moved. Without this trigger the
      # drift check below cannot fire on the PR it exists to catch: a backend PR
      # that regenerates the spec and leaves web/src/client/schema.ts stale.
      - 'docs/public/openapi.json'
      # Frontend paths only. The gateway side of serving the bundle is covered by
      # otari-dashboard-serving.yml, which is triggered by src/gateway/** and runs
      # the pytest half; these two jobs (vitest, and Playwright against a built
      # bundle) test web/ and would only add runtime to a backend PR.
      - '.github/workflows/otari-dashboard.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      # The dashboard bundles this guide (web/src/features/docs/DocsPage.tsx), so a change
      # to it changes the built app; build and test it.
      - 'docs/dashboard.md'
      # The committed API client is generated from the spec, so a spec change is a
      # client change even when no file under web/ moved. Without this trigger the
      # drift check below cannot fire on the PR it exists to catch: a backend PR
      # that regenerates the spec and leaves web/src/client/schema.ts stale.
      - 'docs/public/openapi.json'
      # Frontend paths only. The gateway side of serving the bundle is covered by
      # otari-dashboard-serving.yml, which is triggered by src/gateway/** and runs
      # the pytest half; these two jobs (vitest, and Playwright against a built
      # bundle) test web/ and would only add runtime to a backend PR.
      - '.github/workflows/otari-dashboard.yml'
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Installs the pnpm that web/package.json's `packageManager` field pins, so
    # the version is declared once for CI, the Docker image and a laptop. It has
    # to precede setup-node, whose `cache: pnpm` shells out to pnpm for the store
    # path; `package_json_file` is needed because the pin is in web/, not at the
    # repository root.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: web/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # Biome (web/biome.jsonc): formatting, the recommended rule set, and the layer
    # boundary (a feature may not import the composition root; shared/ may not import
    # either; nothing may import an overlay's tree). `pnpm run lint` is `biome check`,
    # which reports rather than rewrites, so a formatting drift fails here instead of
    # landing as noise in the next person's diff. `pnpm run lint:fix` is the writing one.
    - name: Lint and format check
      run: pnpm run lint

    - name: Type-check
      run: pnpm run typecheck

    - name: Test
      run: pnpm test

    # The bundle is not committed (the Docker image builds it in a web stage), so
    # there is nothing to compare against; this proves the build still succeeds.
    - name: Build
      run: pnpm run build

    # The route tree IS committed (see AGENTS.md), and both steps above rewrite it
    # in place from web/src/routes/. Without this, adding a route and forgetting to
    # commit the regenerated file passes CI green: the runner regenerates it, uses
    # its own copy, and throws it away, leaving the stale one to break the next
    # person's `pnpm run typecheck`, which runs tsc alone and never regenerates.
    - name: Check the committed route tree is up to date
      run: git diff --exit-code -- src/routeTree.gen.ts

    # Same contract for the API client, which is generated from
    # docs/public/openapi.json (see AGENTS.md). `pnpm test` regenerates it, so this
    # catches both a spec change nobody regenerated against and an edit made to the
    # generated file by hand. Without it the runner would quietly use its own fresh
    # copy and pass while the committed one described a different API.
    - name: Check the committed API client is up to date
      run: git diff --exit-code -- src/client/schema.ts

  e2e:
    # Browser end-to-end smoke: boot the gateway serving the freshly built bundle
    # (Playwright's webServer, see web/playwright.config.ts) and walk the core
    # multi-page flows a real operator does.
    #
    # Scoped to this workflow's web/** paths. A change elsewhere in src/gateway that
    # breaks a dashboard-served flow is not caught here; the pytest half of that
    # coverage lives in otari-dashboard-serving.yml, which src/gateway/** triggers.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.14"

    - name: Install Python deps
      run: uv sync --dev --frozen

    # Installs the pnpm that web/package.json's `packageManager` field pins, so
    # the version is declared once for CI, the Docker image and a laptop. It has
    # to precede setup-node, whose `cache: pnpm` shells out to pnpm for the store
    # path; `package_json_file` is needed because the pin is in web/, not at the
    # repository root.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: web/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    - name: Install web deps
      working-directory: web
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Chromium
      working-directory: web
      run: pnpm exec playwright install --with-deps chromium

    # `pnpm run e2e` builds the bundle first (see web/package.json), so a local run
    # and CI serve the same freshly built dashboard.
    - name: Run end-to-end tests
      working-directory: web
      run: pnpm run e2e

    # The suite writes a Playwright trace for any test that fails
    # (`trace: "retain-on-failure"`), which is the only way to see what the browser
    # was actually doing on a failure nobody can reproduce locally. Without this
    # step the runner deletes it and the trace might as well not exist. Failures
    # only, so a green run uploads nothing.
    - name: Upload Playwright traces
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: playwright-traces
        path: web/test-results/
        retention-days: 7
        if-no-files-found: ignore

  screenshots:
    # Visual regression: every screenshot spec captured at three viewports in
    # both themes (web/playwright.config.ts).
    #
    # Deliberately **not** a PR gate yet, which is what `workflow_dispatch`
    # limits it to. The dashboard is mid-migration onto the rehomed design
    # foundation, so pages still move for good reasons; a suite comparing them
    # against committed baselines would fail on most PRs and the baselines
    # themselves would churn in every diff. The harness is here so it can be
    # switched on later by adding `pull_request` back to this job's condition
    # and committing the set it captures.
    #
    # Run it from the Actions tab (or `gh workflow run otari-dashboard.yml`)
    # when you want to see how the pages render: it captures everything and
    # attaches the PNGs as the `screenshot-baselines` artifact, which is also
    # how a Linux baseline set is obtained, since a macOS run renders fonts
    # differently.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.14"

    - name: Install Python deps
      run: uv sync --dev --frozen

    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: web/package.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    - name: Install web deps
      working-directory: web
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Chromium
      working-directory: web
      run: pnpm exec playwright install --with-deps chromium

    # `--update-snapshots=missing` writes a baseline that does not exist yet
    # rather than only reporting it. With no baselines committed, that is every
    # one of them, and Playwright still marks a test whose baseline it had to
    # write as failed, so this step is red by construction today. It is the
    # capture that matters; `continue-on-error` keeps the run from reporting a
    # failure that means nothing until this becomes a gate.
    #
    # No `--` before the flag: pnpm forwards the separator and Playwright's CLI
    # discards everything after it, so the flag would silently never arrive.
    - name: Capture screenshots
      continue-on-error: true
      working-directory: web
      run: pnpm run e2e:screenshots --update-snapshots=missing

    # `continue-on-error` above buys the "missing baselines are not a failure"
    # behavior at the cost of the step's own signal: a gateway that never boots,
    # or a browser that cannot launch, would otherwise leave a green run and an
    # empty artifact. Counting what landed puts that signal back, without
    # asserting the exact number, which changes every time a page is added.
    - name: Check the capture produced something
      working-directory: web
      run: |
        captured=$(find e2e/screenshots -name '*.png' | wc -l | tr -d ' ')
        echo "captured $captured screenshots"
        if [ "$captured" -lt 60 ]; then
          echo "::error::Only $captured screenshots were captured, so the run"
          echo "::error::failed for a reason other than absent baselines."
          exit 1
        fi

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: screenshot-baselines
        path: |
          web/e2e/screenshots/*-snapshots/
          web/test-results/
        retention-days: 7
        if-no-files-found: ignore
