name: "Quality Testing Review"
on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  review:
    uses: ./.github/workflows/automation-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      task: quality-testing
      prompt: .github/prompts/quality-testing-review.prompt.md
