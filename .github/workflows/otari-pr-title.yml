name: Otari PR Title Check

# Enforce Conventional Commits on the PR title. Otari squash-merges PRs
# (squash title = PR title), so the PR title becomes the commit subject that
# git-cliff consumes when generating CHANGELOG.md and the GitHub Release body.
# A non-conventional title would land under cliff.toml's "Other" catch-all
# instead of its real Features / Bug Fixes group.
#
# Defense in depth pairs with cliff.toml: the catch-all parser keeps non-
# conventional commits visible (no silent drop), the release workflow fails
# loudly if git-cliff ever emits a parse-error warning, and this check
# refuses the merge before it can happen.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Mirror the prefixes wired up in cliff.toml's commit_parsers so the
          # set of accepted PR titles matches the set that renders into the
          # changelog. Any addition here must be mirrored there.
          types: |
            feat
            fix
            perf
            security
            revert
            chore
            build
            ci
            docs
            style
            refactor
            test
