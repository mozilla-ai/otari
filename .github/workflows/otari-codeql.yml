name: Otari CodeQL

# No path filter here, unlike the other workflows.
# A filter would let some pull requests skip the scan entirely.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs at 04:17 UTC every Monday.
    # GitHub delays runs scheduled on the hour, so this one is not at 04:00.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  # Cancel superseded PR scans, but let main and scheduled runs finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript is one language, not two.
        language: [ actions, javascript-typescript, python ]
        # Reads `# codeql[rule-id]` on the line above an alert; the dismiss step
        # below then dismisses it. CodeQL ships no such query for actions.
        # The Python one also honors a bare `# noqa` as "suppress every rule on
        # this line", so a ruff noqa must name its rule.
        include:
        - language: javascript-typescript
          suppression: codeql/javascript-queries:AlertSuppression.ql
        - language: python
          suppression: codeql/python-queries:AlertSuppression.ql

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        config-file: .github/codeql/codeql-config.yml
        packs: ${{ matrix.suppression }}

    - name: Analyze
      id: analyze
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        category: '/language:${{ matrix.language }}'
        output: sarif-results

    # Only on main: a dismissal is repository state, and a PR's suppression
    # comment should not take effect before the PR merges.
    - name: Dismiss alerts suppressed in code
      if: github.ref == 'refs/heads/main' && matrix.suppression
      uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
      with:
        sarif-id: ${{ steps.analyze.outputs.sarif-id }}
        sarif-file: sarif-results
      env:
        GITHUB_TOKEN: ${{ github.token }}
