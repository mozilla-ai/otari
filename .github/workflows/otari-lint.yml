name: Otari Lint

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/gateway/**'
      - 'cli/**'
      - 'any-search/**'
      - 'alembic/**'
      - 'tests/**'
      - 'scripts/**'
      - 'DOMAINS.md'
      - 'Makefile'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/otari-lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/gateway/**'
      - 'cli/**'
      - 'any-search/**'
      - 'alembic/**'
      - 'tests/**'
      - 'scripts/**'
      - 'DOMAINS.md'
      - 'Makefile'
      - '.pre-commit-config.yaml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/otari-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: 3.14
        activate-environment: true

    - name: Install dependencies
      run: uv sync --dev --frozen

    - name: Architecture check
      id: architecture
      run: make check-architecture

    - name: Run lint checks
      if: ${{ success() || steps.architecture.conclusion == 'failure' }}
      env:
        SKIP: check-architecture
      run: make lint-python
