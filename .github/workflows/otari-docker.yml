name: Publish Otari Docker Image

on:
  push:
    branches:
      - 'main'
    paths:
      - 'src/gateway/**'
      - 'cli/**'
      - 'any-search/**'
      - 'any-fetch/**'
      - 'alembic/**'
      # The image builds the dashboard bundle in its web stage rather than
      # shipping a committed one, so these are image inputs too.
      - 'web/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'config.example.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/docker_liveness_check.sh'
      - 'scripts/readme_quickstart_check.py'
      - '.github/workflows/otari-docker.yml'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: mzdotai/otari

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Docker Hub trusts this repository's docker-hub environment through an
    # OIDC connection, so no Docker credential is stored, and only the refs the
    # environment allows (main, v* tags) can log in. See RELEASE.md.
    environment: docker-hub
    permissions:
      contents: read
      id-token: write
      # The signed provenance attestation.
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Truncate commit SHA
        run: echo "GITHUB_SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The default lifetime is 300 seconds, and login to the end of the
          # multi-arch push takes 6 to 9 minutes. 3600 is this version's maximum.
          DOCKERHUB_OIDC_EXPIREIN: "3600"
        with:
          registry: ${{ env.REGISTRY }}
          username: mzdotai

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build Docker image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: otari-test:${{ github.sha }}
          build-args: |
            OTARI_VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container liveness check
        run: ./scripts/docker_liveness_check.sh otari-test:${{ github.sha }}

      # Before the push, so an image whose README quickstart cannot start never
      # becomes `latest`. The PR build skips src/gateway/**, where that breaks.
      - name: Run the README quickstart
        run: python3 scripts/readme_quickstart_check.py --image otari-test:${{ github.sha }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.GITHUB_SHA_SHORT }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OTARI_VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      # Signed with this workflow's identity through Sigstore, unlike the
      # BuildKit provenance above, so `gh attestation verify` can tie an image
      # to this repository and workflow. Stored next to the image on Docker Hub.
      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record needs the artifact-metadata permission and adds no
          # verification, so this job does without it.
          create-storage-record: false
