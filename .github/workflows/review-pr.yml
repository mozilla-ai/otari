name: "PR Review"

# On demand only. These runs draw on a Claude subscription, so rate limits are
# the ceiling rather than a bill; a reviewer asking for a review is a better
# signal that one is wanted than every push to every branch.
#
# issue_comment runs this file from main with secrets available, even on a PR
# from a fork, so everything below treats the PR as untrusted data: who may
# trigger it is checked before the secret is reachable, and the review's
# instructions come from main, never from the PR.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    # A cheap pre-filter so ordinary comments do not start a runner.
    # author_association is not a permission check (MEMBER is any org member,
    # COLLABORATOR includes read-only collaborators), so the step below is the
    # real gate.
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/review') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - name: Require write access
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)
          case "$permission" in
            admin|write) echo "$COMMENTER has $permission access" ;;
            *) echo "::error::$COMMENTER has '$permission' access; /review needs write"; exit 1 ;;
          esac

      # Resolve the head now, so the review covers the commit that existed
      # when the command was given, not whatever is pushed while it runs.
      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh pr view "$PR" -R "$REPO" --json headRefOid,baseRefName \
            --jq '"head_sha=\(.headRefOid)\nbase_ref=\(.baseRefName)"' >> "$GITHUB_OUTPUT"

  review:
    needs: authorize
    # Holds CLAUDE_CODE_OAUTH_TOKEN; restrict its deployment branches to main.
    environment: pr-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level, not workflow-level: at workflow level every comment on the
    # PR entered this group and cancelled a review in flight, because a job
    # skipped by `if` still claims the slot, so the review's own comment
    # killed the review.
    concurrency:
      group: pr-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    # These are the whole of what the review can do on GitHub: the action is
    # handed this job's token rather than the Claude GitHub App's, whose
    # installation can write contents, tags and releases.
    permissions:
      contents: read
      # Inline comments and the "no issues" comment.
      pull-requests: write
      # `gh pr view` reads statusCheckRollup, which 403s without these.
      checks: read
      actions: read
    steps:
      # The working tree is main, which is where the prompt and every
      # standards file are read from. A checkout of the PR would let a fork
      # rewrite the review's instructions, including through a CLAUDE.md that
      # Claude Code loads on its own from any directory it reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The PR head as git objects only: readable with `git show` and
      # `git diff`, never written to disk. The repo is public, so this needs
      # no credentials.
      - name: Fetch PR head
        env:
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR/head"
          git cat-file -e "$HEAD_SHA^{commit}"

      - name: Run review
        id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action writes this token into the git remote config and the
          # environment, where the review's shell can read it, so it must be
          # one that can do no harm: scoped to the permissions above, expired
          # when the job ends, and unable to trigger other workflows. Posts
          # come from github-actions[bot] as a result.
          github_token: ${{ github.token }}
          # The review flow is vendored at .github/prompts/pr-review.prompt.md
          # rather than pulled from the upstream code-review plugin, so this
          # repository owns it. The plugin stopped without reviewing whenever
          # Claude had already commented on the PR, which made a re-review
          # after new commits impossible; it also treated a draft as a stop
          # condition, contradicting this workflow's trigger. A `with:` input
          # is not shell-expanded, so the prompt points at the checked-out
          # file rather than inlining it, and names the PR here.
          prompt: "Read .github/prompts/pr-review.prompt.md and follow every instruction in it. The pull request to review is ${{ github.repository }}#${{ github.event.issue.number }}. Its head commit is ${{ needs.authorize.outputs.head_sha }} and its base branch is origin/${{ needs.authorize.outputs.base_ref }}."
          # --allowed-tools is the whole set the run gets: the SDK denies
          # Bash by default.
          #
          # Bash is unscoped deliberately. Scoped `Bash(gh pr diff:*)` rules
          # blocked what the review actually runs: `gh api` for comments,
          # compound commands, and pipes into `head`/`sed`. No Edit or Write,
          # so the tree still cannot be modified.
          #
          # Agent/Task must stay in the list: this review IS a subagent
          # fan-out (context gathering, a summarizer, four parallel review
          # agents, then per-finding validators), so blocking delegation
          # disables the review entirely.
          #
          # `--model opus` is the alias, not a pinned id, so the review tracks
          # the latest Opus without an edit here. Subagent models are named
          # per step in the prompt file.
          #
          # The run link goes in --append-system-prompt because the URL needs
          # `github.run_id`, which the static prompt file cannot interpolate.
          claude_args: |
            --model opus
            --allowed-tools "Agent,Task,Bash,Read,Grep,Glob,TodoWrite,mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Every comment you post on the pull request must end with this line, on its own, verbatim: [View job run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        env:
          # Subagents are auto-backgrounded after ~2 minutes; the parent then
          # ends its turn waiting for completion notifications that a one-shot
          # run never receives, and the job exits green having posted nothing.
          # This keeps subagents in the foreground so their results come back
          # inside the turn.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

      # The execution file is the full transcript, tool output included, and
      # artifacts on a public repo are downloadable by anyone signed in. So
      # upload it only on a re-run with "Enable debug logging" ticked, which
      # needs write access, and keep it for a day.
      - name: Upload logs
        if: always() && runner.debug == '1' && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-logs
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 1
