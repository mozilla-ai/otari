name: "Dead Code Review"
on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  review:
    uses: ./.github/workflows/automation-review.yml
    permissions:
      contents: read
      id-token: write
    with:
      task: dead-code
      prompt: .github/prompts/dead-code-review.prompt.md
