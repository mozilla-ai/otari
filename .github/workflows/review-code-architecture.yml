name: "Code Architecture Review"
on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  review:
    uses: ./.github/workflows/automation-review.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      task: code-architecture
      prompt: .github/prompts/code-architecture-review.prompt.md
