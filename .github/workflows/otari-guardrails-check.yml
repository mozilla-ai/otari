name: Otari Guardrails Check

# Runs the repository's path and verifier gates (.otari/) against every pull
# request, so a change made without `otari hook` registered still meets them.
# otari-guardrails-judges.yml runs the judge gates. See
# docs/agent-guardrails.md, "Checking a pull request in CI".
#
# The CLI, the gates and the verifier scripts come from the base commit, so a
# pull request's edits to them do not change what checks it. This file is not
# covered: pull_request runs it as the pull request has it, and a verifier
# calls scripts in the pull request's tree. It therefore holds no secret, and
# review of this file and of those scripts is what keeps it honest.
on:
  pull_request:
    branches: [ main ]

permissions: {}

concurrency:
  group: otari-guardrails-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: Path and verifier gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secret and no environment: a verifier runs in the pull request's
    # tree, and whatever it calls there is the pull request's code.
    permissions:
      contents: read
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      # A verifier finds what changed through `git status`, the way it does at
      # the end of an agent's turn, so the whole pull request is staged against
      # the commit it branched from.
      - name: Stage the change against its merge base
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git reset --soft "$(git merge-base "$BASE_SHA" HEAD)"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.14
          enable-cache: false

      - name: Install the CLI from the base commit
        run: uv sync --frozen --no-dev --package otari-agent --directory base

      # A base commit from before the command existed cannot check anything,
      # and taking the command from the pull request instead would let the
      # pull request decide its own result. Only the usage error for an unknown
      # command (exit 2) means that; any other failure is a broken install.
      - name: Check that the base commit can run the gates
        id: cli
        run: |
          if base/.venv/bin/otari guardrails check --help > /dev/null 2> "$RUNNER_TEMP/probe.txt"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$?" -eq 2 ]; then
            echo "::notice title=Guardrails check skipped::The base commit's CLI has no \`otari guardrails check\`."
          else
            cat "$RUNNER_TEMP/probe.txt"
            exit 1
          fi

      # --base names the base commit even though HEAD is already the merge
      # base, so the range stays right if the staging step changes.
      - name: Run the path and verifier gates
        if: steps.cli.outputs.ready == 'true'
        working-directory: pr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          "$GITHUB_WORKSPACE/base/.venv/bin/otari" guardrails check \
            --base "$BASE_SHA" --type path --type verifier \
            --guardrails-from "$GITHUB_WORKSPACE/base"
