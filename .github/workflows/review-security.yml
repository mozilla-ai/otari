name: "Security Review"
on:
  schedule:
    - cron: "0 4 * * 3,5"
  workflow_dispatch:

permissions: {}

jobs:
  review:
    uses: ./.github/workflows/automation-review.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      task: security
      prompt: .github/prompts/security-penetration-review.prompt.md
