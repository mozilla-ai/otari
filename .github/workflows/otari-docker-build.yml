name: Otari Docker Build

# Build the image on a PR that changes what goes into it.
#
# otari-docker.yml only builds on push to main and on a release, so a broken
# image recipe surfaces after merge, where it takes the `latest` publish and the
# otari-ai deploy dispatch down with it. That mattered less when the image was a
# `COPY` of already-built files; now the image builds the dashboard in a Node
# stage, so a web-side change can break it.
#
# The paths are deliberately narrower than the publish workflow's. They are the
# inputs that decide whether the image builds at all: the recipe, the web stage's
# sources, and dependency resolution. src/gateway/** is left out on purpose. A
# Python source change cannot fail the build (nothing compiles it) and
# otari-tests.yml already covers it, so including it would add a multi-minute
# image build to nearly every PR for no signal.
#
# Single-platform on purpose too: this proves the recipe works and the container
# boots. The publish workflow still builds linux/arm64 under QEMU, which is
# slower than is worth spending per PR.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'web/**'
      - 'docs/dashboard.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/docker_liveness_check.sh'
      - '.github/workflows/otari-docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Reads the cache the publish workflow's test build writes on main, and
      # deliberately does not write one back: a fork PR has no write access to
      # the cache backend, and a read-only miss is just a slower build.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: otari-pr:${{ github.sha }}
          build-args: |
            OTARI_VERSION=${{ github.sha }}
          cache-from: type=gha

      # Boots the image against Postgres, checks the health endpoints, and
      # confirms "/" serves the built dashboard rather than the tutorial
      # fallback, which is what a bundle that never reached the image looks like.
      - name: Run container liveness check
        run: ./scripts/docker_liveness_check.sh otari-pr:${{ github.sha }}
