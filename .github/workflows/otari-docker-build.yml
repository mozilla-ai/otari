name: Otari Docker Build

# Build the image on a PR that changes what goes into it.
#
# otari-docker.yml only builds on push to main and on a release, so a broken
# image recipe surfaces after merge, where it takes the `latest` publish and the
# otari-ai deploy dispatch down with it. That mattered less when the image was a
# `COPY` of already-built files; now the image builds the dashboard in a Node
# stage, so a web-side change can break it.
#
# The paths are deliberately narrower than the publish workflow's. They are the
# inputs that decide whether the image builds at all: the recipe, the web stage's
# sources, and dependency resolution. src/gateway/** is left out on purpose. A
# Python source change cannot fail the build (nothing compiles it) and
# otari-tests.yml already covers it, so including it would add a multi-minute
# image build to nearly every PR for no signal. That stays true now the container
# also serves a request below: what the hybrid smoke adds here is whether the
# *image* can serve one (its layout, entrypoint and baked environment), and the
# same walk against the source checkout runs per PR in otari-oss-edition.yml.
# cli/src/** is the one Python source that is listed: the liveness check asserts
# what `otari --version` reports inside the image.
#
# Single-platform on purpose too: this proves the recipe works and the container
# boots. The publish workflow still builds linux/arm64 under QEMU, which is
# slower than is worth spending per PR.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'web/**'
      - 'docs/dashboard.md'
      - 'pyproject.toml'
      - 'cli/pyproject.toml'
      - 'cli/src/**'
      - 'uv.lock'
      - 'scripts/docker_liveness_check.sh'
      - 'scripts/hybrid_edition_smoke.py'
      - '.github/workflows/otari-docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Reads the cache the publish workflow's test build writes on main, and
      # deliberately does not write one back: a fork PR has no write access to
      # the cache backend, and a read-only miss is just a slower build.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: otari-pr:${{ github.sha }}
          build-args: |
            OTARI_VERSION=${{ github.sha }}
          cache-from: type=gha

      # Boots the image against Postgres, checks the health endpoints, and
      # confirms "/" serves the built dashboard rather than the tutorial
      # fallback, which is what a bundle that never reached the image looks like.
      - name: Run container liveness check
        run: ./scripts/docker_liveness_check.sh otari-pr:${{ github.sha }}

      # Liveness proves the container answers its health probes. This proves it
      # can serve a request: the same hybrid walk as otari-oss-edition.yml, run
      # against the image a deployment actually pulls rather than a source
      # checkout. The image pins OTARI_HOST/OTARI_PORT as environment variables,
      # which beat a mounted config file, so an image that boots but cannot
      # serve is a break only this step sees.
      - name: Install the smoke's environment
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"

      - name: Smoke the container in hybrid mode
        run: |
          uv sync --frozen --no-dev
          uv run --frozen --no-dev python scripts/hybrid_edition_smoke.py \
            --image otari-pr:${{ github.sha }}
