name: Otari Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/gateway/**'
      - 'alembic/**'
      - 'tests/integration/**'
      - 'tests/unit/**'
      # Two unit tests read the tool cards to pin the UI ceilings to the server's.
      - 'web/src/features/tools/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/otari-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/gateway/**'
      - 'alembic/**'
      - 'tests/integration/**'
      - 'tests/unit/**'
      # Two unit tests read the tool cards to pin the UI ceilings to the server's.
      - 'web/src/features/tools/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/otari-tests.yml'
  workflow_dispatch:

# A new push to a pull request supersedes its older run.
# A run on main always finishes, so every commit keeps its coverage upload.
concurrency:
  group: otari-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-unit:
    name: test-unit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each value is INDEX/COUNT, and the list must hold every INDEX from 1 to COUNT.
        shard: ["1/4", "2/4", "3/4", "4/4"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: 3.14
        activate-environment: true

    - name: Install dependencies
      run: |
         uv sync --dev --frozen

    - name: Run Otari unit tests
      run: |
        uv run pytest tests/unit -v --cov --cov-report=xml -n auto --shard ${{ matrix.shard }}

    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        flags: unit
        fail_ci_if_error: false

  test-integration:
    name: test-integration (${{ matrix.shard }})
    runs-on: ubuntu-latest
    environment: integration-tests
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each value is INDEX/COUNT, and the list must hold every INDEX from 1 to COUNT.
        shard: ["1/4", "2/4", "3/4", "4/4"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: 3.14
        activate-environment: true

    - name: Install dependencies
      run: |
         uv sync --dev --frozen

    - name: Run Otari integration tests
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        uv run pytest tests/integration -v --cov --cov-report=xml -n auto --shard ${{ matrix.shard }}

    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        flags: integration
        fail_ci_if_error: false

  openapi-spec:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: 3.14
        activate-environment: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Verify OpenAPI spec is up to date
      run: make openapi-check

    - name: Verify Postman collection is up to date
      run: make postman-check
